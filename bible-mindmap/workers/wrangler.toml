name = "bible-mindmap-visitor"
main = "visitor.js"
compatibility_date = "2026-08-08"

# KV namespace for visitor counters.
# Create via: `wrangler kv namespace create VISITOR_KV` (from ./workers)
# Then paste the returned id below.
[[kv_namespaces]]
binding = "VISITOR_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Observability (Workers Logs) — free tier.
[observability]
enabled = true

# Optional: bind to a custom domain later via `[[routes]]`.
# [[routes]]
# pattern = "counter.example.com/*"
# custom_domain = true
