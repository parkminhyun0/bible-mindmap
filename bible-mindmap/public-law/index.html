<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>부동산공법 법령 마인드맵</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}button,input{font:inherit}.wrap{max-width:1500px;margin:auto;padding:16px 12px 70px}.hero{padding:25px;border-radius:22px;background:linear-gradient(135deg,#102f73,#2563eb);color:white;box-shadow:0 15px 38px rgba(29,78,216,.18)}h1{margin:4px 0 7px;font-size:clamp(29px,5vw,48px);letter-spacing:-.045em;line-height:1.1}.hero p{margin:0;color:#dbeafe;font-size:13px}.searchbar{position:sticky;top:4px;z-index:30;margin:12px 0;padding:9px;background:rgba(244,247,251,.96);backdrop-filter:blur(12px);border:1px solid #dce3ed;border-radius:16px;box-shadow:0 7px 20px rgba(15,23,42,.05)}.searchrow,.actions{display:flex;gap:7px;flex-wrap:wrap}.searchrow input{flex:1;min-width:240px;min-height:46px;border:1px solid #cbd5e1;border-radius:11px;padding:0 13px;background:#fff;outline:none}.searchrow input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.btn{min-height:44px;border:1px solid #d6dfeb;background:white;border-radius:11px;padding:0 13px;font-weight:850;color:#344054;cursor:pointer;-webkit-tap-highlight-color:transparent}.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:white}.btn:active{transform:translateY(1px)}.actions{margin-top:7px}.searchmeta{font-size:11px;color:#667085;margin:7px 2px 0}.results{display:none;gap:6px;margin-top:8px;max-height:48vh;overflow:auto}.results.on{display:grid}.result{border:1px solid #e1e7ef;background:#fff;border-radius:10px;padding:9px;text-align:left;cursor:pointer;color:#172033}.result b{display:block;font-size:12px}.result small{display:block;color:#667085;margin-top:2px}.result span{display:block;font-size:10px;color:#596579;margin-top:3px}.law{margin-top:12px;border:1px solid #dce3ed;border-radius:18px;background:white;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,.05)}.lawhead{display:grid;grid-template-columns:1fr auto;gap:8px;padding:15px;cursor:pointer;list-style:none}.lawhead::-webkit-details-marker,.chapter>summary::-webkit-details-marker,.item>summary::-webkit-details-marker{display:none}.lawhead h2{margin:0;font-size:17px}.lawhead small{color:#667085}.lawbody{padding:0 13px 14px}.overview,.actors{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}.box{border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:8px}.box b{font-size:10px;color:#1d4ed8}.box p{font-size:11px;margin:3px 0 0;color:#475467}.actor{border:1px solid #f1dfb7;background:#fffdf8;border-radius:9px;padding:7px}.actor b{font-size:9.5px;color:#9a6700}.actor strong{display:block;font-size:11px}.actor small{display:block;color:#667085;font-size:10px}.chapter{border:1px solid #e3e8ef;border-radius:11px;margin:7px 0;overflow:hidden}.chapter>summary{padding:10px;background:#fbfcfe;font-weight:850;cursor:pointer;list-style:none}.items{padding:8px}.item{border:1px solid #e4e9f0;border-radius:10px;margin:6px 0;padding:9px}.item>summary{cursor:pointer;font-weight:800;font-size:12px;list-style:none}.itembody{padding-top:7px}.label{font-size:9px;font-weight:900;color:#667085}.txt{font-size:10.8px;color:#475467;margin:2px 0 7px}.num{color:#d00000;font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}.numbers{padding:8px;border-left:4px solid #dc2626;background:#fff7f7;border-radius:8px;font-size:10.5px;color:#7f1d1d;margin-top:6px}.relations{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.rel{border:1px solid #e1e7ef;border-radius:9px;padding:7px;font-size:10.5px}.rel b{display:block;color:#1d4ed8}.flash{animation:f 1.7s}@keyframes f{30%,70%{box-shadow:0 0 0 5px rgba(220,38,38,.24)}}.loading{padding:36px;text-align:center;color:#667085}.status{font-size:11px;color:#667085;margin-top:8px}@media(max-width:720px){.overview,.actors,.relations{grid-template-columns:1fr}.wrap{padding:10px}.searchrow input{min-width:100%}.searchrow .btn{flex:1}}</style></head><body><main class="wrap"><section class="hero"><small>REAL ESTATE PUBLIC LAW</small><h1>🏛️ 부동산공법 법령 마인드맵</h1><p>의의·목적·지정권자·시행자·상하위 관계와 핵심 숫자를 검색 가능한 상세 구조로 정리했습니다.</p></section><section class="searchbar"><div class="searchrow"><input id="q" type="search" autocomplete="off" placeholder="검색: 지정권자, 시행자, 환지, 재건축, 3분의 2, 30세대, 농지전용"><button class="btn primary" id="runSearch" type="button">🔎 검색</button><button class="btn" id="clearSearch" type="button">지우기</button></div><div class="actions"><button class="btn" id="openAll" type="button">전체 펼치기</button><button class="btn" id="closeAll" type="button">전체 접기</button><button class="btn" id="printBtn" type="button">인쇄 / PDF</button></div><div class="searchmeta" id="summary">검색어를 입력하고 검색 버튼을 누르세요.</div><div class="results" id="results"></div></section><div id="app"><div class="loading">법령 데이터를 불러오는 중…</div></div><div class="status">기준일 2026-08-26 · 학습용 구조화 자료 · 시험·실무 적용 시 최신 시행 법령을 재확인하세요.</div></main><script src="/d0.js"></script><script src="/d1.js"></script><script src="/d2.js"></script><script src="/d3.js"></script><script src="/d4.js"></script><script src="/d5.js"></script><script>
const PACK=window.PACK_CHUNKS.join("");let DATA=[],IDX=[];const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hi=s=>esc(s).replace(/(\d+(?:\.\d+)?\s*(?:만|천)?\s*(?:㎡|제곱미터|m²|년|개월|일|층|호|세대|명)|\d+\s*분의\s*\d+|\d+\s*%|과반수)/g,'<span class="num">$1</span>');async function unpack(){const bin=Uint8Array.from(atob(PACK),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();return JSON.parse(text)}function render(){let h='';DATA.forEach((l,li)=>{h+=`<details class="law" id="${l.id}" open><summary class="lawhead"><div><small>${esc(l.stage)}</small><h2>${esc(l.name)}</h2><small>${esc(l.effective)}</small></div><b>›</b></summary><div class="lawbody"><div class="overview">${l.overview.map(x=>`<div class="box"><b>${esc(x[0])}</b><p>${hi(x[1])}</p></div>`).join('')}</div><h3>👥 핵심 관계자·권한자</h3><div class="actors">${l.actors.map(x=>`<div class="actor"><b>${esc(x[0])}</b><strong>${hi(x[1])}</strong><small>${hi(x[2])}</small></div>`).join('')}</div>${l.chapters.map((ch,ci)=>`<details class="chapter"><summary>${esc(ch[0])} · ${ch[1].length}개 항목</summary><div class="items">${ch[1].map((it,ri)=>`<details class="item" id="n-${li}-${ci}-${ri}"><summary>${hi(it[0])}</summary><div class="itembody"><div class="label">의의 · 의미</div><div class="txt">${hi(it[1])}</div><div class="label">목적 · 왜 필요한가</div><div class="txt">${hi(it[2])}</div>${(it[3]||[]).map(n=>`<div class="numbers">🔴 ${hi(n.replace(/^🔴 핵심 숫자\s*/,''))}</div>`).join('')}</div></details>`).join('')}</div></details>`).join('')}<h3>🔗 다른 법률과의 연결</h3><div class="relations">${l.relations.map(r=>`<div class="rel"><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}</div></div></details>`});$('#app').innerHTML=h}function buildIndex(){const a=[];DATA.forEach((l,li)=>l.chapters.forEach((ch,ci)=>ch[1].forEach((it,ri)=>a.push({id:`n-${li}-${ci}-${ri}`,law:l.name,ch:ch[0],title:it[0],snippet:(it[1]||'').slice(0,150),text:[it[0],it[1],it[2],...(it[3]||[]),...l.actors.flat()].join(' ')}))));return a}async function init(){try{DATA=await unpack();render();IDX=buildIndex();$('#summary').textContent='검색 준비 완료 · '+IDX.length+'개 세부항목'}catch(e){$('#app').innerHTML='<div class="loading">데이터 로드 오류: '+esc(e.message)+'</div>'}}function search(){const raw=$('#q').value.trim(),q=raw.toLowerCase();$('#results').classList.add('on');if(!q){$('#summary').textContent='검색어를 입력하세요.';$('#results').innerHTML='';return}const hits=IDX.filter(x=>x.text.toLowerCase().includes(q)).slice(0,100);$('#summary').textContent=`“${raw}” 검색 결과 ${hits.length}건`;$('#results').innerHTML=hits.map(x=>`<button class="result" type="button" data-id="${x.id}"><b>${hi(x.title)}</b><small>${esc(x.law)} › ${esc(x.ch)}</small><span>${esc(x.snippet)}</span></button>`).join('')||'<div class="result">검색 결과가 없습니다.</div>';$$('.result[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id))}function go(id){const el=document.getElementById(id);if(!el)return;let p=el;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement}el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');el.scrollIntoView({behavior:'smooth',block:'center'})}$('#runSearch').addEventListener('click',search);$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});$('#clearSearch').addEventListener('click',()=>{$('#q').value='';$('#results').innerHTML='';$('#results').classList.remove('on');$('#summary').textContent='검색어를 입력하고 검색 버튼을 누르세요.';$('#q').focus()});$('#openAll').addEventListener('click',()=>$$('details').forEach(x=>x.open=true));$('#closeAll').addEventListener('click',()=>$$('details').forEach(x=>x.open=false));$('#printBtn').addEventListener('click',()=>window.print());init();</script></body></html>
