<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부동산공법 법령 마인드맵</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;color:#172033}.load{text-align:center;padding:30px}.spin{width:32px;height:32px;border:4px solid #dbe5f1;border-top-color:#1d4ed8;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><b>부동산공법 학습 웹앱을 여는 중입니다.</b></div><script>(async()=>{try{let s='';for(let i=1;i<=4;i++)s+=await(await fetch(`./c${i}.txt`)).text();const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>앱을 여는 중 오류가 발생했습니다.</b><p>'+e.message+'</p></div>'}})();</script></body></html>
