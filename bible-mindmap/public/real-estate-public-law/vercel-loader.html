<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부동산공법 법령 마인드맵</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;color:#172033}.load{text-align:center;padding:30px}.spin{width:34px;height:34px;border:4px solid #dbe5f1;border-top-color:#1d4ed8;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:680px;line-height:1.7}</style></head><body><div class="load"><div class="spin"></div><b>부동산공법 학습 웹앱을 여는 중입니다.</b></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/parkminhyun0/bible-mindmap/deploy/real-estate-public-law/bible-mindmap/public/real-estate-public-law/';let s='';for(let i=1;i<=4;i++){const r=await fetch(base+'c'+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('데이터 '+i+' 로드 실패: '+r.status);s+=await r.text()}const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. Safari/Chrome 최신 버전에서 열어 주세요.');const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load err"><h2>앱을 열지 못했습니다</h2><p>'+e.message+'</p><p>페이지를 새로고침해 주세요.</p></div>'}})();</script></body></html>
