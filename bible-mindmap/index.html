<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="성경맵" />
    <title>성경 마인드맵 · PARK MIN HYUN · Jarvis claude-sonnet 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
    <style>
      .lex-def { font-size: 12px; line-height: 1.75; color: #334155; }
      .lex-def p { margin: 0 0 7px; }
      .lex-def p:last-child { margin-bottom: 0; }
      .lex-def b, .lex-def strong { color: #1e293b; font-weight: 600; }
      .lex-def i, .lex-def em { color: #475569; font-style: italic; }
      .lex-def a { color: #3b82f6 !important; text-decoration: none; font-weight: 600; }
      .lex-def a:hover { text-decoration: underline; }
      .lex-def ul, .lex-def ol { margin: 4px 0; padding-left: 18px; }
      .lex-def li { margin-bottom: 3px; }
      .lex-etym { color: #64748b !important; font-size: 11px; }
      .lex-kjv { color: #64748b !important; font-size: 11px; border-top: 1px solid #f1f5f9; padding-top: 6px; margin-top: 6px; }

      html, body { overscroll-behavior-y: none; }
      .h-screen-safe { height: 100vh; height: 100dvh; }
      .momentum-scroll { -webkit-overflow-scrolling: touch; }
      @media (max-width: 767px) { .tap-target { min-width: 40px; min-height: 40px; } }

      /* 앱 CSS 번들이 실패해도 읽을 수 있는 독립 부팅 화면 */
      .boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 10%, rgba(16,185,129,.16), transparent 34%),
          radial-gradient(circle at 85% 18%, rgba(37,99,235,.15), transparent 36%),
          #f6f8fb;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      }
      .boot-fallback__card {
        width: min(460px, 100%);
        padding: 34px;
        border: 1px solid rgba(15,23,42,.1);
        border-radius: 24px;
        background: rgba(255,255,255,.88);
        box-shadow: 0 28px 80px rgba(15,23,42,.14);
        text-align: center;
      }
      .boot-fallback__icon { font-size: 38px; margin-bottom: 12px; }
      .boot-fallback h1 { margin: 0 0 12px; font-size: clamp(23px, 5vw, 32px); line-height: 1.3; }
      .boot-fallback p { margin: 0; color: #64748b; line-height: 1.7; }
      .boot-fallback__actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
      .boot-fallback__actions button, .boot-fallback__actions a {
        min-height: 44px;
        padding: 11px 17px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #1e293b;
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
      }
      .boot-fallback__actions .primary-recovery { border-color: #2563eb; background: #2563eb; color: #fff; }
      .boot-fallback__detail { margin-top: 13px !important; font-size: 12px; color: #94a3b8 !important; }

      .bm-home-link {
        width: 30px; height: 30px; flex: 0 0 30px; display: inline-flex;
        align-items: center; justify-content: center; border-radius: 9px;
        border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.14);
        color: #fff; text-decoration: none; font-size: 14px; line-height: 1;
        box-shadow: 0 2px 8px rgba(15,23,42,.14);
        transition: background .18s ease, transform .18s ease;
      }
      .bm-home-link:hover { background: rgba(255,255,255,.24); transform: translateY(-1px); }
      .bm-home-link:focus-visible { outline: 2px solid #bfdbfe; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="boot-fallback" class="boot-fallback" role="status" aria-live="polite">
      <div class="boot-fallback__card">
        <div class="boot-fallback__icon" aria-hidden="true">📖</div>
        <h1>성경 마인드맵을 여는 중입니다</h1>
        <p id="boot-message">첫 실행에는 잠시 시간이 걸릴 수 있습니다.</p>
        <div class="boot-fallback__actions">
          <button class="primary-recovery" type="button" onclick="window.__bmRecoverApp?.()">다시 연결하기</button>
          <a id="boot-home-link" href="../">랜딩페이지로</a>
        </div>
        <p class="boot-fallback__detail" id="boot-detail">앱 준비 상태를 확인하고 있습니다.</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function installBootRecovery() {
        var recoveryStarted = false;
        var loadError = false;

        function appBasePath() {
          var path = location.pathname;
          var marker = '/app/';
          var index = path.indexOf(marker);
          return index >= 0 ? path.slice(0, index + marker.length) : path.replace(/[^/]*$/, '');
        }

        function landingPath() {
          var path = location.pathname;
          var marker = '/app/';
          var index = path.indexOf(marker);
          return index >= 0 ? path.slice(0, index + 1) : '/';
        }

        function showRecovery(reason) {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) return;
          fallback.querySelector('h1').textContent = '앱을 열지 못했습니다';
          var message = document.getElementById('boot-message');
          var detail = document.getElementById('boot-detail');
          if (message) message.textContent = '이전 배포 주소나 오래된 브라우저 캐시가 남아 있을 수 있습니다.';
          if (detail) detail.textContent = reason || '최신 앱 주소로 다시 연결해 주세요.';
          var home = document.getElementById('boot-home-link');
          if (home) home.href = landingPath();
        }

        window.__bmRecoverApp = function recoverApp() {
          if (recoveryStarted) return;
          recoveryStarted = true;
          try {
            sessionStorage.removeItem('__bm_cache_reload');
            localStorage.removeItem('__bm_build_id');
          } catch (storageError) {}

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function(registrations) {
                return Promise.all(registrations.map(function(registration) {
                  return registration.unregister();
                }));
              })
              .catch(function() {})
              .finally(function() {
                location.replace(appBasePath() + '?fresh=' + Date.now());
              });
          } else {
            location.replace(appBasePath() + '?fresh=' + Date.now());
          }
        };

        window.addEventListener('error', function(event) {
          var target = event.target;
          var assetFailed = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          if (assetFailed) {
            loadError = true;
            showRecovery('앱 구성 파일을 불러오지 못했습니다. 다시 연결하면 최신 파일을 요청합니다.');
          }
        }, true);

        window.addEventListener('unhandledrejection', function() {
          loadError = true;
          showRecovery('앱 초기화 중 오류가 발생했습니다. 다시 연결해 주세요.');
        });

        setTimeout(function() {
          var root = document.getElementById('root');
          var fallback = document.getElementById('boot-fallback');
          if (fallback && (!root || root.childElementCount === 0 || loadError)) {
            showRecovery('12초 동안 앱이 시작되지 않았습니다. 최신 공개 주소로 다시 연결할 수 있습니다.');
          }
        }, 12000);
      })();

      (function bustStaleCache() {
        var BUILD_ID = '__BM_BUILD_ID__';
        var STORED = null;
        try {
          STORED = localStorage.getItem('__bm_build_id');
          if (!/[?&](?:_v|fresh)=/.test(location.search) && STORED && STORED !== BUILD_ID) {
            localStorage.setItem('__bm_build_id', BUILD_ID);
            var url = new URL(location.href);
            url.searchParams.set('fresh', Date.now());
            location.replace(url.toString());
            return;
          }
          localStorage.setItem('__bm_build_id', BUILD_ID);
        } catch (storageError) {}
      })();

      (function selfHealCache() {
        var reloaded = null;
        try { reloaded = sessionStorage.getItem('__bm_cache_reload'); } catch (storageError) {}
        window.addEventListener('error', function(e) {
          var isBundle = e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK');
          var isRefErr = e.error && /is not defined|Cannot read propert/.test(e.error.message || '');
          if ((isBundle || isRefErr) && !reloaded && !/[?&]fresh=/.test(location.search)) {
            try { sessionStorage.setItem('__bm_cache_reload', '1'); } catch (storageError) {}
            var url = new URL(location.href);
            url.searchParams.set('fresh', Date.now());
            location.replace(url.toString());
          }
        }, true);
        window.addEventListener('load', function() {
          setTimeout(function() {
            try { sessionStorage.removeItem('__bm_cache_reload'); } catch (storageError) {}
          }, 3000);
        });
      })();

      (function installLandingHomeButton() {
        function landingUrl() {
          var path = location.pathname;
          var marker = '/app/';
          var index = path.indexOf(marker);
          return index >= 0 ? path.slice(0, index + 1) : '/';
        }
        function attach() {
          var title = document.querySelector('.at-sidebar-titlebar h2');
          if (!title || title.parentElement.querySelector('.bm-home-link')) return false;
          var link = document.createElement('a');
          link.className = 'bm-home-link';
          link.href = landingUrl();
          link.title = '랜딩페이지로 돌아가기';
          link.setAttribute('aria-label', '홈 · 랜딩페이지로 돌아가기');
          link.textContent = '⌂';
          title.insertAdjacentElement('afterend', link);
          return true;
        }
        if (!attach()) {
          var observer = new MutationObserver(function() {
            if (attach()) observer.disconnect();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function() { observer.disconnect(); }, 15000);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
