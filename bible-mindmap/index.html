<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- index.html 캐시 방지 (모바일 사파리·크롬이 오래된 번들 해시 참조하는 문제 해결)
         번들 파일(index-*.js)은 해시가 붙어 있어 캐시 안전 · index.html 만 no-cache 로 유지 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA: 홈 화면 설치 · standalone 모드 · 상단 상태바 톤 -->
    <meta name="theme-color" content="#d97706" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="성경맵" />
    <title>성경 마인드맵 · PARK MIN HYUN · Jarvis claude-sonnet 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* 렉시콘 팝업 정의 영역 */
      .lex-def { font-size: 12px; line-height: 1.75; color: #334155; }
      .lex-def p { margin: 0 0 7px; }
      .lex-def p:last-child { margin-bottom: 0; }
      .lex-def b, .lex-def strong { color: #1e293b; font-weight: 600; }
      .lex-def i, .lex-def em { color: #475569; font-style: italic; }
      .lex-def a { color: #3b82f6 !important; text-decoration: none; font-weight: 600; }
      .lex-def a:hover { text-decoration: underline; }
      .lex-def ul, .lex-def ol { margin: 4px 0; padding-left: 18px; }
      .lex-def li { margin-bottom: 3px; }
      .lex-etym { color: #64748b !important; font-size: 11px; }
      .lex-kjv  { color: #64748b !important; font-size: 11px; border-top: 1px solid #f1f5f9; padding-top: 6px; margin-top: 6px; }

      /* 모바일 반응형 유틸리티 (전역) */
      html, body { overscroll-behavior-y: none; }
      .h-screen-safe { height: 100vh; height: 100dvh; }
      .momentum-scroll { -webkit-overflow-scrolling: touch; }
      @media (max-width: 767px) {
        .tap-target { min-width: 40px; min-height: 40px; }
      }

      /* 앱 타이틀 옆 랜딩 복귀 버튼 */
      .bm-home-link {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        border: 1px solid rgba(255,255,255,.22);
        background: rgba(255,255,255,.14);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        line-height: 1;
        box-shadow: 0 2px 8px rgba(15,23,42,.14);
        transition: background .18s ease, transform .18s ease;
      }
      .bm-home-link:hover { background: rgba(255,255,255,.24); transform: translateY(-1px); }
      .bm-home-link:focus-visible { outline: 2px solid #bfdbfe; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="boot-fallback" class="boot-fallback" role="status" aria-live="polite">
      <div class="boot-fallback__card">
        <div class="boot-fallback__icon" aria-hidden="true">📖</div>
        <h1>성경 마인드맵을 여는 중입니다</h1>
        <p>모바일 환경에서는 첫 실행에 잠시 시간이 걸릴 수 있습니다.</p>
        <button type="button" onclick="location.reload()">화면이 멈추면 다시 불러오기</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function bustStaleCache() {
        var BUILD_ID = '__BM_BUILD_ID__';
        var STORED = null;
        try {
          STORED = localStorage.getItem('__bm_build_id');
          if (location.search.indexOf('_v=') === -1 && STORED && STORED !== BUILD_ID) {
            localStorage.setItem('__bm_build_id', BUILD_ID);
            var url = new URL(location.href);
            url.searchParams.set('_v', Date.now());
            location.replace(url.toString());
            return;
          }
          localStorage.setItem('__bm_build_id', BUILD_ID);
        } catch (storageError) {}
      })();

      (function selfHealCache() {
        var reloaded = null;
        try { reloaded = sessionStorage.getItem('__bm_cache_reload'); } catch (storageError) {}
        window.addEventListener('error', function(e) {
          var isBundle = e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK');
          var isRefErr = e.error && /is not defined|Cannot read propert/.test(e.error.message || '');
          if ((isBundle || isRefErr) && !reloaded) {
            try { sessionStorage.setItem('__bm_cache_reload', '1'); } catch (storageError) {}
            var url = new URL(location.href);
            url.searchParams.set('_v', Date.now());
            location.replace(url.toString());
          }
        }, true);
        window.addEventListener('load', function() {
          setTimeout(function() {
            try { sessionStorage.removeItem('__bm_cache_reload'); } catch (storageError) {}
          }, 3000);
        });
      })();

      (function installLandingHomeButton() {
        function landingUrl() {
          var path = location.pathname;
          var marker = '/app/';
          var index = path.indexOf(marker);
          return index >= 0 ? path.slice(0, index + 1) : '/';
        }
        function attach() {
          var title = document.querySelector('.at-sidebar-titlebar h2');
          if (!title || title.parentElement.querySelector('.bm-home-link')) return false;
          var link = document.createElement('a');
          link.className = 'bm-home-link';
          link.href = landingUrl();
          link.title = '랜딩페이지로 돌아가기';
          link.setAttribute('aria-label', '홈 · 랜딩페이지로 돌아가기');
          link.textContent = '⌂';
          title.insertAdjacentElement('afterend', link);
          return true;
        }
        if (!attach()) {
          var observer = new MutationObserver(function() {
            if (attach()) observer.disconnect();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function() { observer.disconnect(); }, 15000);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
