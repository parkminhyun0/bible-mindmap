<aside id="landing-visitor-status" aria-label="접속자 현황">
  <div class="landing-visitor-status__title">👥 접속자 현황</div>
  <div class="landing-visitor-status__metrics" role="status" aria-live="polite">
    <div class="landing-visitor-status__metric">
      <strong id="landing-visitor-today">–</strong>
      <span>투데이</span>
    </div>
    <span class="landing-visitor-status__divider" aria-hidden="true"></span>
    <div class="landing-visitor-status__metric">
      <strong id="landing-visitor-total">–</strong>
      <span>총 합계</span>
    </div>
  </div>
  <div id="landing-visitor-error" class="landing-visitor-status__error" hidden>접속자 수를 불러오지 못했습니다.</div>
</aside>
<script>
(() => {
  const workspace = 'parkminhyun0-bible-mindmap';
  const totalName = 'visits';
  const date = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
  const todayName = `visits-${date}`;
  const totalFlag = 'bmm-visitor-total-counted-v3';
  const todayFlag = `bmm-visitor-today-counted-${date}`;
  const totalCache = 'bmm-visitor-total-cache-v3';
  const todayCache = `bmm-visitor-today-cache-${date}`;

  const readCache = (key) => {
    try { return localStorage.getItem(key); } catch { return null; }
  };
  const writeCache = (key, value) => {
    try { localStorage.setItem(key, String(value)); } catch {}
  };
  const endpoint = (name, increment) =>
    `https://api.counterapi.dev/v2/${workspace}/${name}${increment ? '/up' : ''}`;
  const requestCount = async (name, increment) => {
    const response = await fetch(endpoint(name, increment), { cache: 'no-store' });
    if (!response.ok) throw new Error(`counter ${response.status}`);
    const payload = await response.json();
    const value = payload?.data?.up_count ?? payload?.data?.count ?? payload?.count;
    if (typeof value !== 'number') throw new Error('counter value missing');
    return value;
  };
  const load = async ({ name, flag, cache, target }) => {
    const element = document.getElementById(target);
    if (!element) return false;
    const alreadyCounted = readCache(flag) === '1';
    try {
      const value = await requestCount(name, !alreadyCounted);
      element.textContent = Number.isFinite(value) ? value.toLocaleString('ko-KR') : String(value);
      writeCache(cache, value);
      if (!alreadyCounted) writeCache(flag, '1');
      return true;
    } catch {
      const cached = readCache(cache);
      if (cached != null) {
        const numeric = Number(cached);
        element.textContent = Number.isFinite(numeric) ? numeric.toLocaleString('ko-KR') : cached;
        return true;
      }
      element.textContent = '–';
      return false;
    }
  };

  Promise.all([
    load({ name: todayName, flag: todayFlag, cache: todayCache, target: 'landing-visitor-today' }),
    load({ name: totalName, flag: totalFlag, cache: totalCache, target: 'landing-visitor-total' }),
  ]).then((results) => {
    const error = document.getElementById('landing-visitor-error');
    if (error) error.hidden = results.some(Boolean);
  });
})();
</script>
