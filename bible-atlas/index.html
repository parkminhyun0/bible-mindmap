<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📖 BibleAtlas — MVP Prototype</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Noto Sans KR", sans-serif; }

    #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

    /* 사이드바 */
    #sidebar {
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column;
      border-right: 1px solid #1e293b;
    }
    #sidebar header {
      padding: 16px 18px; border-bottom: 1px solid #1e293b;
      background: linear-gradient(135deg, #1e3a8a, #4c1d95);
    }
    #sidebar header h1 { margin: 0; font-size: 15px; letter-spacing: -0.02em; }
    #sidebar header p  { margin: 4px 0 0; font-size: 11px; color: #cbd5e1; opacity: 0.85; }

    #eras {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 12px; border-bottom: 1px solid #1e293b;
    }
    .era-btn {
      padding: 5px 10px; font-size: 11px; font-weight: 600;
      background: #1e293b; color: #cbd5e1;
      border: 1px solid #334155; border-radius: 999px;
      cursor: pointer; transition: all .15s;
    }
    .era-btn:hover { background: #334155; }
    .era-btn.active { background: #3b82f6; color: #fff; border-color: #60a5fa; }

    #place-list {
      flex: 1; overflow-y: auto; padding: 6px 0;
    }
    .place-row {
      padding: 8px 16px; cursor: pointer;
      font-size: 12px; border-left: 3px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .place-row:hover { background: #1e293b; }
    .place-row.active {
      background: rgba(59,130,246,0.15);
      border-left-color: #3b82f6;
    }
    .place-row .ko { font-weight: 700; color: #f1f5f9; }
    .place-row .en { color: #94a3b8; font-size: 10px; margin-top: 2px; }
    .place-row .refs { color: #64748b; font-size: 10px; margin-top: 3px; }

    /* 여정 섹션 */
    #journeys {
      padding: 10px 12px; border-top: 1px solid #1e293b;
      background: #0b1220;
    }
    #journeys .section-title {
      font-size: 10px; font-weight: 700; color: #94a3b8;
      letter-spacing: 0.15em; margin-bottom: 8px;
    }
    .journey-btn {
      display: block; width: 100%; text-align: left;
      padding: 8px 10px; margin-bottom: 4px;
      background: #1e293b; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 6px;
      cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .journey-btn:hover { background: #334155; border-color: #475569; }
    .journey-btn.active { background: #7c3aed; border-color: #a78bfa; }
    .journey-btn .name { font-size: 12px; font-weight: 700; }
    .journey-btn .sub  { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .journey-btn.active .sub { color: #ddd6fe; }

    #journey-controls {
      display: none; gap: 4px; margin-top: 6px;
    }
    #journey-controls.visible { display: flex; }
    #journey-controls button {
      flex: 1; padding: 5px 0; font-size: 11px; font-weight: 700;
      background: #334155; color: #f1f5f9;
      border: none; border-radius: 4px; cursor: pointer;
      font-family: inherit;
    }
    #journey-controls button:hover { background: #475569; }

    #footer {
      padding: 10px 14px; font-size: 10px; color: #64748b;
      border-top: 1px solid #1e293b; text-align: center;
    }

    /* 지도 */
    #map { width: 100%; height: 100%; }

    /* 팝업 커스터마이징 */
    .maplibregl-popup-content {
      padding: 14px 16px; border-radius: 10px;
      font-family: inherit; max-width: 300px;
    }
    .popup-title {
      font-size: 14px; font-weight: 800; color: #0f172a;
      margin-bottom: 2px;
    }
    .popup-sub {
      font-size: 10px; color: #64748b; margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .popup-desc {
      font-size: 12px; color: #334155; line-height: 1.5; margin-bottom: 8px;
    }
    .popup-refs {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .popup-refs .ref {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #eff6ff; color: #1e40af; font-weight: 600;
    }

    /* 3D 토글 */
    #controls {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      display: flex; gap: 6px;
    }
    #controls button {
      padding: 7px 12px; font-size: 11px; font-weight: 700;
      background: rgba(15,23,42,0.92); color: #fff;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
      cursor: pointer; backdrop-filter: blur(6px);
    }
    #controls button:hover { background: rgba(30,58,138,0.95); }
    #controls button.active { background: #2563eb; }

    /* 데스크톱만 (모바일 미대응 MVP) */
    @media (max-width: 720px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
      #sidebar { border-right: none; border-bottom: 1px solid #1e293b; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>📖 BibleAtlas</h1>
      <p>성경을 지도 위에서 시간 축으로 걷다 — MVP Prototype</p>
    </header>
    <div id="eras"></div>
    <div id="place-list"></div>
    <div id="journeys">
      <div class="section-title">✧ 여정 트레이싱</div>
      <div id="journey-list"></div>
      <div id="journey-controls">
        <button id="jc-pause">⏸ 일시정지</button>
        <button id="jc-stop">■ 정지</button>
      </div>
    </div>
    <div id="footer">데이터 · OpenBible.info · Wikipedia · 좌표 자체 큐레이션</div>
  </aside>
  <div style="position:relative;">
    <div id="controls">
      <button id="btn-crescent" class="active">🌾 비옥한 초승달</button>
      <button id="btn-3d">🏔️ 3D 지형</button>
      <button id="btn-reset">🌍 전체 보기</button>
    </div>
    <div id="map"></div>
  </div>
</div>

// ── 시대 필터 ────────────────────────────────────────────────────────
const ERAS = [
  { id: 'all',      label: '전체' },
  { id: 'patriarch',label: '족장기' },
  { id: 'exodus',   label: '출애굽' },
  { id: 'kingdom',  label: '왕정' },
  { id: 'exile',    label: '포로기' },
  { id: 'nt',       label: '신약' },
];

let currentEra = 'all';
let selectedId = null;

// ── 지도 초기화 ──────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: [35.2, 31.8],  // 이스라엘 중심
  zoom: 6,
  pitch: 0,
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');

let markers = [];
let currentPopup = null;

function renderMarkers() {
  markers.forEach(m => m.remove());
  markers = [];
  const filtered = currentEra === 'all'
    ? PLACES
    : PLACES.filter(p => p.era.includes(currentEra));

  filtered.forEach(p => {
    const el = document.createElement('div');
    const active = p.id === selectedId;
    el.style.cssText = `
      width: ${active ? 18 : 14}px; height: ${active ? 18 : 14}px;
      border-radius: 50%; cursor: pointer;
      background: ${active ? '#dc2626' : '#2563eb'};
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      transition: all .15s;
    `;
    el.onmouseenter = () => (el.style.transform = 'scale(1.35)');
    el.onmouseleave = () => (el.style.transform = 'scale(1)');
    el.onclick = () => openPlace(p);

    const m = new maplibregl.Marker({ element: el }).setLngLat(p.coord).addTo(map);
    markers.push(m);
  });
}

function openPlace(p) {
  selectedId = p.id;
  renderMarkers();
  renderList();

  if (currentPopup) currentPopup.remove();
  const refsHtml = p.refs.map(r => `<span class="ref">${r}</span>`).join('');
  currentPopup = new maplibregl.Popup({ offset: 15, maxWidth: '320px' })
    .setLngLat(p.coord)
    .setHTML(`
      <div class="popup-title">${p.ko}</div>
      <div class="popup-sub">${p.en}  ·  ${p.coord[1].toFixed(3)}°N, ${p.coord[0].toFixed(3)}°E</div>
      <div class="popup-desc">${p.desc}</div>
      <div class="popup-refs">${refsHtml}</div>
    `)
    .addTo(map);

  map.flyTo({ center: p.coord, zoom: 9, speed: 1.2 });
}

function renderEras() {
  const el = document.getElementById('eras');
  el.innerHTML = ERAS.map(e =>
    `<button class="era-btn ${e.id === currentEra ? 'active' : ''}" data-era="${e.id}">${e.label}</button>`
  ).join('');
  el.querySelectorAll('.era-btn').forEach(btn => {
    btn.onclick = () => { currentEra = btn.dataset.era; selectedId = null; renderEras(); renderList(); renderMarkers(); };
  });
}

function renderList() {
  const el = document.getElementById('place-list');
  const filtered = currentEra === 'all'
    ? PLACES
    : PLACES.filter(p => p.era.includes(currentEra));
  el.innerHTML = filtered.map(p =>

// ── 여정 트레이싱 ────────────────────────────────────────────────────
let activeJourneyId = null;
let dashAnimId = null;
let flyTimeouts = [];
let isPaused = false;

const JOURNEY_SRC = 'journey-line-src';
const JOURNEY_LAYER_DRAWN = 'journey-drawn';   // 완성된 실선 (뒷쪽)
const JOURNEY_LAYER_DASH  = 'journey-dash';    // 흐르는 점선 (앞쪽)

function ensureJourneyLayers() {
  if (map.getSource(JOURNEY_SRC)) return;
  map.addSource(JOURNEY_SRC, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: JOURNEY_LAYER_DRAWN, type: 'line', source: JOURNEY_SRC,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': ['get', 'color'],
      'line-width': 3,
      'line-opacity': 0.35,
    },
  });
  map.addLayer({
    id: JOURNEY_LAYER_DASH, type: 'line', source: JOURNEY_SRC,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': ['get', 'color'],
      'line-width': 4,
      'line-dasharray': [0, 4, 3],
    },
  });
}

function playJourney(journey) {
  stopJourney();
  activeJourneyId = journey.id;
  isPaused = false;

  // path 배열의 모든 waypoint 좌표
  const allCoords = journey.path.map(p => p.coord);
  if (allCoords.length < 2) return;

  // turf.bezierSpline 으로 부드러운 곡선 생성 (자연스러운 이동 경로)
  const rawLine = turf.lineString(allCoords);
  const smoothed = turf.bezierSpline(rawLine, { resolution: 12000, sharpness: 0.75 });
  const smoothCoords = smoothed.geometry.coordinates;

  ensureJourneyLayers();
  map.getSource(JOURNEY_SRC).setData({
    type: 'FeatureCollection',
    features: [{
      type: 'Feature',
      properties: { color: journey.color },
      geometry: { type: 'LineString', coordinates: smoothCoords },
    }],
  });

  // 점선이 흘러가는 애니메이션 (dash-array 오프셋 반복)
  const dashPatterns = [
    [0, 4, 3], [1, 4, 2], [2, 4, 1], [3, 4, 0],
    [0, 1, 3, 3], [0, 2, 3, 2], [0, 3, 3, 1],
  ];
  let step = 0;
  const animateDash = () => {
    if (!map.getLayer(JOURNEY_LAYER_DASH)) return;
    map.setPaintProperty(JOURNEY_LAYER_DASH, 'line-dasharray', dashPatterns[step % dashPatterns.length]);
    step++;
    dashAnimId = setTimeout(animateDash, 120);
  };
  animateDash();

  renderJourneyList();
  document.getElementById('journey-controls').classList.add('visible');

  // 전체 경로를 한눈에 볼 수 있도록 fit
  const bounds = allCoords.reduce(
    (b, c) => b.extend(c),
    new maplibregl.LngLatBounds(allCoords[0], allCoords[0]),
  );
  map.fitBounds(bounds, { padding: 80, duration: 1400, maxZoom: 7 });

  // 성경 명시 stop 만 순차 방문 (경유 waypoint 는 지나감)
  const stops = journey.path.filter(p => p.stop);
  const perStopMs = 3800;
  stops.forEach((p, i) => {
    const t = setTimeout(() => {
      if (isPaused || activeJourneyId !== journey.id) return;
      map.flyTo({ center: p.coord, zoom: 8, speed: 0.7, curve: 1.4 });
      if (currentPopup) currentPopup.remove();
      const refsHtml = (p.refs || []).map(r => `<span class="ref">${r}</span>`).join('');
      currentPopup = new maplibregl.Popup({ offset: 15, maxWidth: '340px', closeButton: false })
        .setLngLat(p.coord)
        .setHTML(`
          <div class="popup-title">${i + 1}. ${p.name}</div>
          <div class="popup-sub">${journey.name}  ·  성경 지점 ${i + 1}/${stops.length}</div>
          <div class="popup-desc">${p.desc || ''}</div>
          <div class="popup-refs">${refsHtml}</div>
        `)
        .addTo(map);
    }, 2500 + i * perStopMs);
    flyTimeouts.push(t);
  });

  // 마지막에 전체 여정 다시 보기
  const finalT = setTimeout(() => {
    if (activeJourneyId !== journey.id) return;
    map.fitBounds(bounds, { padding: 80, duration: 1800, maxZoom: 7 });
  }, 2500 + stops.length * perStopMs + 800);
  flyTimeouts.push(finalT);
}

function stopJourney() {
  activeJourneyId = null;
  isPaused = false;
  if (dashAnimId) { clearTimeout(dashAnimId); dashAnimId = null; }
  flyTimeouts.forEach(t => clearTimeout(t));
  flyTimeouts = [];
  if (map.getSource(JOURNEY_SRC)) {
    map.getSource(JOURNEY_SRC).setData({ type: 'FeatureCollection', features: [] });
  }
  document.getElementById('journey-controls').classList.remove('visible');
  renderJourneyList();
}

function pauseJourney() {
  isPaused = !isPaused;
  document.getElementById('jc-pause').textContent = isPaused ? '▶ 이어서' : '⏸ 일시정지';
  if (isPaused) {
    flyTimeouts.forEach(t => clearTimeout(t));
    flyTimeouts = [];
    if (dashAnimId) { clearTimeout(dashAnimId); dashAnimId = null; }
  } else {
    // 재개는 단순화를 위해 처음부터 재생 (MVP)
    const j = JOURNEYS.find(x => x.id === activeJourneyId);
    if (j) playJourney(j);
  }
}

function renderJourneyList() {
  const el = document.getElementById('journey-list');
  el.innerHTML = JOURNEYS.map(j =>
    `<button class="journey-btn ${j.id === activeJourneyId ? 'active' : ''}" data-id="${j.id}">
       <div class="name">${j.id === activeJourneyId ? '▶ ' : ''}${j.name}</div>
       <div class="sub">${j.sub}</div>
     </button>`
  ).join('');
  el.querySelectorAll('.journey-btn').forEach(btn => {
    btn.onclick = () => {
      const j = JOURNEYS.find(x => x.id === btn.dataset.id);
      if (activeJourneyId === j.id) stopJourney();
      else playJourney(j);
    };
  });
}

document.getElementById('jc-pause').onclick = pauseJourney;
document.getElementById('jc-stop').onclick  = stopJourney;

let crescentVisible = true;
function ensureCrescentLayer() {
  if (map.getSource('fertile-crescent')) return;
  map.addSource('fertile-crescent', { type: 'geojson', data: FERTILE_CRESCENT_GEOJSON });

  // 하단에 배치 — 도로/지명 위에 뜨지 않도록. 지형/베이스 위에만.
  const firstSymbolId = (() => {
    const layers = map.getStyle().layers || [];
    const first = layers.find(l => l.type === 'symbol');
    return first?.id;
  })();

  map.addLayer({
    id: 'fertile-crescent-fill',
    type: 'fill',
    source: 'fertile-crescent',
    paint: {
      'fill-color': '#4d7c0f',
      'fill-opacity': 0.28,
    },
  }, firstSymbolId);

  map.addLayer({
    id: 'fertile-crescent-outline',
    type: 'line',
    source: 'fertile-crescent',
    paint: {
      'line-color': '#365314',
      'line-width': 1.4,
      'line-opacity': 0.75,
    },
  }, firstSymbolId);

  // 라벨 (중앙에 표기)
  map.addSource('fertile-crescent-label', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [39.5, 36.4] },
          properties: { title: 'FERTILE CRESCENT', sub: '비옥한 초승달 지대' },
        },
      ],
    },
  });
  map.addLayer({
    id: 'fertile-crescent-label',
    type: 'symbol',
    source: 'fertile-crescent-label',
    layout: {
      'text-field': ['format',
        ['get', 'title'], { 'font-scale': 1.0 },
        '\n', {},
        ['get', 'sub'],   { 'font-scale': 0.72 },
      ],
      'text-size': 13,
      'text-letter-spacing': 0.15,
      'text-anchor': 'center',
      'text-allow-overlap': false,
    },
    paint: {
      'text-color': '#365314',
      'text-halo-color': '#f7fee7',
      'text-halo-width': 1.5,
      'text-opacity': 0.85,
    },
  });
}

function setCrescentVisible(v) {
  crescentVisible = v;
  const visibility = v ? 'visible' : 'none';
  ['fertile-crescent-fill', 'fertile-crescent-outline', 'fertile-crescent-label'].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visibility);
  });
  document.getElementById('btn-crescent').classList.toggle('active', v);
}

document.getElementById('btn-crescent').onclick = () => setCrescentVisible(!crescentVisible);

// ── 초기 렌더 ────────────────────────────────────────────────────────
map.on('load', () => {
  ensureCrescentLayer();
  renderEras();
  renderList();
  renderMarkers();
  renderJourneyList();
});
</script>
