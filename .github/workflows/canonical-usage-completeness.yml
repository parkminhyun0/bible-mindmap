name: Canonical usage completeness

on:
  pull_request:
    paths:
      - 'bible-mindmap/src/data/canonicalConcepts*.js'
      - 'bible-mindmap/src/data/canonicalUsageMap*.js'
      - 'bible-mindmap/scripts/verify-canonical-usage-completeness.mjs'
      - '.github/workflows/canonical-usage-completeness.yml'
  push:
    branches: [main]
    paths:
      - 'bible-mindmap/src/data/canonicalConcepts*.js'
      - 'bible-mindmap/src/data/canonicalUsageMap*.js'
      - 'bible-mindmap/scripts/verify-canonical-usage-completeness.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify canonical concepts and references
        run: node scripts/verify-canonical-concepts.mjs
      - name: Verify concept and usage-map completeness
        run: node scripts/verify-canonical-usage-completeness.mjs
      - name: Build application
        run: npm run build
