name: Validate pull request

on:
  pull_request:
    branches: [main]
  # A trusted main run re-verifies the pinned Playwright container whenever
  # this workflow or the lockfile changes, including Playwright upgrades.
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pr.yml'
      - 'bible-mindmap/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Generate production and full npm audit reports
        shell: bash
        run: |
          mkdir -p reports/security
          set +e
          npm audit --omit=dev --json > reports/security/npm-audit-production.json
          production_exit=$?
          npm audit --json > reports/security/npm-audit-full.json
          full_exit=$?
          set -e
          if [ "$production_exit" -gt 1 ] || [ "$full_exit" -gt 1 ]; then
            echo "::error::npm audit service failed (production=${production_exit}, full=${full_exit})"
            exit 2
          fi

      - name: Block production high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-production.json
          --label=production
          --fail-on=high

      - name: Block full high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-full.json
          --label=full
          --fail-on=high

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: bible-mindmap/reports/security/*.json
          if-no-files-found: error
          retention-days: 30

  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Measure Genesis Korean Strong integration
        run: node scripts/verify-korean-strong-genesis.mjs

      - name: Verify dependency integrity
        run: npm run verify:dependency-integrity

      - name: Verify cross-registry data integrity
        run: npm run verify:data-registry

      - name: Verify legacy source registry adapter policy
        run: node scripts/tests/source-registry-adapter-policy.mjs

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Verify curated chapter hard gates
        run: node scripts/verify-curated-chapters.mjs

      - name: Verify canonical concept hard gates
        run: node scripts/verify-canonical-concepts.mjs

      - name: Run full application build
        run: npm run build

      - name: Guard tracked source integrity
        run: node scripts/guard-no-source-mutation.mjs

  browser-smoke:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      # Keep Node 20 as the project runtime even though the pinned Playwright
      # image carries its own Node version. This matches the non-container jobs.
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Resolve npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-node20-playwright-container-v1.61.1-${{ hashFiles('bible-mindmap/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-playwright-container-v1.61.1-

      - name: Report npm cache
        run: echo "cache-hit=${{ steps.npm-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: npm ci

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Verify Playwright container contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const nodeMajor = Number(process.versions.node.split('.')[0]);
          const projectVersion = require('./node_modules/playwright/package.json').version;
          const dockerInfoPath = '/ms-playwright/.docker-info';

          if (nodeMajor !== 20) {
            console.error(`::error::browser-smoke Node runtime drifted: expected 20.x, got ${process.versions.node}`);
            process.exit(1);
          }
          if (!fs.existsSync(dockerInfoPath)) {
            console.error(`::error::Playwright container marker missing: ${dockerInfoPath}`);
            process.exit(1);
          }

          const dockerInfo = JSON.parse(fs.readFileSync(dockerInfoPath, 'utf8'));
          if (dockerInfo.driverVersion !== projectVersion) {
            console.error(`::error::Playwright version mismatch: project=${projectVersion}, container=${dockerInfo.driverVersion}. Update package-lock.json and the browser-smoke container tag together.`);
            process.exit(1);
          }

          const { chromium, webkit } = require('playwright');
          for (const [name, browserType] of [['chromium', chromium], ['webkit', webkit]]) {
            const executable = browserType.executablePath();
            if (!fs.existsSync(executable)) {
              console.error(`::error::Baked ${name} executable missing: ${executable}`);
              process.exit(1);
            }
            console.log(`${name}=${executable}`);
          }

          console.log(`Playwright container aligned: version=${projectVersion}, node=${process.versions.node}`);
          NODE

      - name: Run desktop, mobile, tablet, and modal smoke tests
        run: npm run test:smoke

      - name: Run iPhone WebKit lexical bridge smoke
        run: >-
          npx playwright test
          tests/lexical-bridge-context-ui.spec.js
          tests/lexical-bridge-webkit-landscape.spec.js
          --project=webkit-iphone

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bible-mindmap/playwright-report
            bible-mindmap/test-results
          if-no-files-found: ignore
          retention-days: 14
