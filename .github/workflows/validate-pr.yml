name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          TIPTAP_VERSION=$(node -p "require('./node_modules/@tiptap/pm/package.json').version")
          MISSING=0
          for pkg in \
            @tiptap/react \
            @tiptap/starter-kit \
            @tiptap/extension-color \
            @tiptap/extension-text-align \
            @tiptap/extension-text-style \
            @tiptap/extension-underline; do
            if ! node -e "require.resolve('$pkg')" >/dev/null 2>&1; then
              MISSING=1
              break
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Tiptap lock entries incomplete; aligning runtime packages to ${TIPTAP_VERSION}"
            npm install --no-save --package-lock=false --legacy-peer-deps \
              "@tiptap/react@${TIPTAP_VERSION}" \
              "@tiptap/starter-kit@${TIPTAP_VERSION}" \
              "@tiptap/extension-color@${TIPTAP_VERSION}" \
              "@tiptap/extension-text-align@${TIPTAP_VERSION}" \
              "@tiptap/extension-text-style@${TIPTAP_VERSION}" \
              "@tiptap/extension-underline@${TIPTAP_VERSION}"
          fi

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Verify curated chapter hard gates
        run: node scripts/verify-curated-chapters.mjs

      - name: Verify canonical concept hard gates
        run: node scripts/verify-canonical-concepts.mjs

      - name: Run full application build
        run: npm run build

      - name: Guard tracked source integrity
        run: node scripts/guard-no-source-mutation.mjs
