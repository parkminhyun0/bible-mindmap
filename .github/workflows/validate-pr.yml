name: Validate pull request

on:
  pull_request:
    branches: [main]
  # A trusted main run seeds the default-branch Playwright browser cache so
  # later pull requests can restore it. Re-seed when this workflow or the
  # lockfile changes (including Playwright version changes).
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pr.yml'
      - 'bible-mindmap/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Generate production and full npm audit reports
        shell: bash
        run: |
          mkdir -p reports/security
          set +e
          npm audit --omit=dev --json > reports/security/npm-audit-production.json
          production_exit=$?
          npm audit --json > reports/security/npm-audit-full.json
          full_exit=$?
          set -e
          if [ "$production_exit" -gt 1 ] || [ "$full_exit" -gt 1 ]; then
            echo "::error::npm audit service failed (production=${production_exit}, full=${full_exit})"
            exit 2
          fi

      - name: Block production high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-production.json
          --label=production
          --fail-on=high

      - name: Block full high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-full.json
          --label=full
          --fail-on=high

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: bible-mindmap/reports/security/*.json
          if-no-files-found: error
          retention-days: 30

  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Measure Genesis Korean Strong integration
        run: node scripts/verify-korean-strong-genesis.mjs

      - name: Verify dependency integrity
        run: npm run verify:dependency-integrity

      - name: Verify cross-registry data integrity
        run: npm run verify:data-registry

      - name: Verify legacy source registry adapter policy
        run: node scripts/tests/source-registry-adapter-policy.mjs

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Verify curated chapter hard gates
        run: node scripts/verify-curated-chapters.mjs

      - name: Verify canonical concept hard gates
        run: node scripts/verify-canonical-concepts.mjs

      - name: Run full application build
        run: npm run build

      - name: Guard tracked source integrity
        run: node scripts/guard-no-source-mutation.mjs

  browser-smoke:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: node -e "const p=require('./node_modules/playwright/package.json'); console.log('version='+p.version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('bible-mindmap/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Report Playwright browser cache
        run: echo "cache-hit=${{ steps.playwright-browser-cache.outputs.cache-hit }}"

      - name: Configure apt network bounds for Playwright dependencies
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99playwright-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Ensure Playwright system dependencies
        shell: bash
        timeout-minutes: 8
        run: |
          if npx playwright install-deps --dry-run chromium webkit; then
            echo "Playwright system dependencies already satisfied; skipping apt install."
            exit 0
          fi

          for attempt in 1 2; do
            echo "Playwright dependency install attempt ${attempt}/2"
            if npx playwright install-deps chromium webkit; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 5
            fi
          done
          exit 1

      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: npx playwright install chromium webkit

      - name: Run desktop, mobile, tablet, and modal smoke tests
        run: npm run test:smoke

      - name: Run iPhone WebKit lexical bridge smoke
        run: >-
          npx playwright test
          tests/lexical-bridge-context-ui.spec.js
          tests/lexical-bridge-webkit-landscape.spec.js
          --project=webkit-iphone

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bible-mindmap/playwright-report
            bible-mindmap/test-results
          if-no-files-found: ignore
          retention-days: 14
