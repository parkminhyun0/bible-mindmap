name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Generate production and full npm audit reports
        shell: bash
        run: |
          mkdir -p reports/security
          set +e
          npm audit --omit=dev --json > reports/security/npm-audit-production.json
          production_exit=$?
          npm audit --json > reports/security/npm-audit-full.json
          full_exit=$?
          set -e
          if [ "$production_exit" -gt 1 ] || [ "$full_exit" -gt 1 ]; then
            echo "::error::npm audit service failed (production=${production_exit}, full=${full_exit})"
            exit 2
          fi

      - name: Block production high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-production.json
          --label=production
          --fail-on=high

      - name: Block full high and critical vulnerabilities
        run: >-
          node scripts/summarize-npm-audit.mjs
          --input=reports/security/npm-audit-full.json
          --label=full
          --fail-on=high

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: bible-mindmap/reports/security/*.json
          if-no-files-found: error
          retention-days: 30

  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency integrity
        run: npm run verify:dependency-integrity

      - name: Verify cross-registry data integrity
        run: npm run verify:data-registry

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Verify curated chapter hard gates
        run: node scripts/verify-curated-chapters.mjs

      - name: Verify canonical concept hard gates
        run: node scripts/verify-canonical-concepts.mjs

      - name: Run full application build
        run: npm run build

      - name: Guard tracked source integrity
        run: node scripts/guard-no-source-mutation.mjs

  browser-smoke:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bible-mindmap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon

      - name: Install Chromium only
        run: npx playwright install chromium

      - name: Run desktop, mobile, tablet, and modal smoke tests
        run: npm run test:smoke

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bible-mindmap/playwright-report
            bible-mindmap/test-results
          if-no-files-found: ignore
          retention-days: 14
