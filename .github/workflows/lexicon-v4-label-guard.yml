name: Lexicon v4 Label Guard

# lexicon-v4-auto-merge-eligible 라벨이 PR에 붙는 순간 실제 diff 스코프를 검사해서
# 렉시콘 밖 파일이 섞여 있으면 라벨을 즉시 제거하고 사유를 코멘트로 남긴다.
# issues:labeled는 PR 라벨 이벤트도 전달하며, workflow는 기본 브랜치의 신뢰된 코드만 checkout한다.
# PR head 코드를 write token 권한으로 실행하지 않는다.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    if: github.event.issue.pull_request && github.event.label.name == 'lexicon-v4-auto-merge-eligible'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Enforce lexicon-only scope
        uses: actions/github-script@v9
        with:
          script: |
            const { V4_LABEL, isLexiconScope } = await import(`${process.env.GITHUB_WORKSPACE}/bible-mindmap/scripts/lib/v4-auto-merge-decision.mjs`)
            const issueNumber = context.payload.issue.number
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
              per_page: 100,
            })
            const nonLexicon = files.map((f) => f.filename).filter((f) => !isLexiconScope(f))
            if (nonLexicon.length === 0) {
              core.info(`✓ label ${V4_LABEL} 검증 통과 · 렉시콘 스코프만 포함`)
              return
            }
            const preview = nonLexicon.slice(0, 5).map((f) => `- \`${f}\``).join('\n')
            const extra = nonLexicon.length > 5 ? `\n- ... 외 ${nonLexicon.length - 5}개` : ''
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: V4_LABEL,
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `⚠️ \`${V4_LABEL}\` 라벨을 자동 제거했습니다.`,
                '',
                '이 PR에는 렉시콘 스코프 밖의 파일이 포함되어 있어 v4 auto-merge 대상이 될 수 없습니다:',
                '',
                preview + extra,
                '',
                '해결 방법:',
                '- 렉시콘 파일만 담긴 PR로 분리하거나',
                '- 사람 리뷰 경로로 진행하세요.',
              ].join('\n'),
            })
            core.warning(`removed ${V4_LABEL} due to ${nonLexicon.length} non-lexicon files`)
