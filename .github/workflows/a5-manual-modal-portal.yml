name: A5 one-time manual modal portal patch

on:
  push:
    branches:
      - chatgpt/a5-security-deploy-audit
    paths:
      - .github/workflows/a5-manual-modal-portal.yml

permissions:
  contents: write

jobs:
  patch-manual-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/a5-security-deploy-audit
      - name: Move ManualModal to document body portal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bible-mindmap/src/components/ManualModal.jsx')
          source = path.read_text()

          old_import = "import { useState, useRef, useEffect, useCallback } from 'react';\n"
          new_import = old_import + "import { createPortal } from 'react-dom';\n"
          if "import { createPortal } from 'react-dom';" not in source:
              if old_import not in source:
                  raise SystemExit('React import anchor not found')
              source = source.replace(old_import, new_import, 1)

          old_return = "  const activeData = SECTIONS.find((s) => s.id === activeSection);\n\n  return (\n    <div\n"
          new_return = "  const activeData = SECTIONS.find((s) => s.id === activeSection);\n\n  return createPortal((\n    <div\n"
          if old_return not in source:
              raise SystemExit('ManualModal return anchor not found')
          source = source.replace(old_return, new_return, 1)

          old_close = "    </div>\n  );\n}\n\nconst iconBtnStyle"
          new_close = "    </div>\n  ), document.body);\n}\n\nconst iconBtnStyle"
          if old_close not in source:
              raise SystemExit('ManualModal closing anchor not found')
          source = source.replace(old_close, new_close, 1)

          path.write_text(source)
          PY
      - name: Commit portal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible-mindmap/src/components/ManualModal.jsx
          git commit -m "fix: portal manual modal outside transformed mobile sheet"
          git push origin HEAD:chatgpt/a5-security-deploy-audit
