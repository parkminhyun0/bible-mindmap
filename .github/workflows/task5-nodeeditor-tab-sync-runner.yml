name: Task5 NodeEditor tab sync implementation runner

on:
  push:
    branches:
      - pipeline/task-nodeeditor-tab-sync

permissions:
  contents: write

jobs:
  implement-verify-and-push:
    if: github.ref_name == 'pipeline/task-nodeeditor-tab-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pipeline/task-nodeeditor-tab-sync
          fetch-depth: 0

      - name: Confirm base and protected scope
        run: |
          test "$(git merge-base HEAD ce02c72f1900df882030176176c9b224835f37d7)" = "ce02c72f1900df882030176176c9b224835f37d7"
          git diff --exit-code ce02c72f1900df882030176176c9b224835f37d7 -- memory/RESUME.json

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies and build generated lexicon fixtures
        working-directory: bible-mindmap
        run: |
          npm ci
          npm run build:lexicon

      - name: Apply minimal fix and add regression to browser smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('bible-mindmap')

          p = root / 'src/components/NodeEditor.jsx'
          text = p.read_text(encoding='utf-8')
          pairs = [
            ("editor.commands.setContent('');", "editor.commands.setContent('', { emitUpdate: false });"),
            ("editor.commands.setContent(html);", "editor.commands.setContent(html, { emitUpdate: false });"),
          ]
          for old, new in pairs:
            if text.count(old) != 1:
              raise SystemExit(f'NodeEditor anchor drift: {old} count={text.count(old)}')
            text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = root / 'package.json'
          text = p.read_text(encoding='utf-8')
          old = '"test:smoke": "playwright test tests/p0-regression.spec.js tests/p1-modal-accessibility.spec.js tests/claude-audit-regression.spec.js tests/lexical-bridge-context-ui.spec.js --project=chromium"'
          new = '"test:smoke": "playwright test tests/p0-regression.spec.js tests/p1-modal-accessibility.spec.js tests/claude-audit-regression.spec.js tests/lexical-bridge-context-ui.spec.js tests/nodeeditor-tab-sync-regression.spec.js --project=chromium"'
          if text.count(old) != 1:
            raise SystemExit(f'package test:smoke anchor drift count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run verifier and oxlint
        working-directory: bible-mindmap
        run: |
          node scripts/verify-translation-switching-stability.mjs
          npm run lint
          git diff --check

      - name: Run selected-node regression
        working-directory: bible-mindmap
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          TASK5_TRACE_PATH: /tmp/task5-tab-sync-trace.json
        run: npx playwright test tests/nodeeditor-tab-sync-regression.spec.js --project=chromium --reporter=line

      - name: Run full verifier and production build
        working-directory: bible-mindmap
        run: npm run build

      - name: Run complete browser smoke set
        working-directory: bible-mindmap
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npm run test:smoke

      - name: Write implementation report from actual trace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trace = json.loads(Path('/tmp/task5-tab-sync-trace.json').read_text(encoding='utf-8'))
          after = trace['snapshots'][:4]
          after_rows = '\n'.join(
            f"| {x['step']} | {x['activeTab']} | {x['bodyLanguage']} | `{x['prefix40']}` |" for x in after
          )
          report = f'''# task5 · 02-impl — NodeEditor 번역 탭 동기화 데이터 손실 수정

## 기준과 범위

- 기준 `main`: `ce02c72f1900df882030176176c9b224835f37d7`
- 브랜치: `pipeline/task-nodeeditor-tab-sync`
- Draft PR: #389
- PR #388 (`pipeline/task-hebrew-text-normalize`)은 수정·rebase·push하지 않았다.
- `memory/RESUME.json`은 변경하지 않았다.

## 수정한 두 곳과 이유

`src/components/NodeEditor.jsx`의 프로그램적 TipTap 동기화 두 곳만 수정했다.

1. 선택 해제 초기화
   - 전: `editor.commands.setContent('')`
   - 후: `editor.commands.setContent('', {{ emitUpdate: false }})`
   - 이유: 프로그램적 초기화를 사용자 편집 update로 오인해 stale `editData` 저장 핸들러를 깨우지 않게 한다.
2. 선택 노드/역본 콘텐츠 동기화
   - 전: `editor.commands.setContent(html)`
   - 후: `editor.commands.setContent(html, {{ emitUpdate: false }})`
   - 이유: Tiptap v3 기본 update 이벤트가 이전 탭 closure를 동기적으로 실행하여 새 탭 HTML을 `translations.krv` 등 이전 슬롯에 기록하던 경로를 끊는다.

상태 구조, `editor.on('update')` handler, Tiptap 버전, 본문 스타일/레이아웃은 변경하지 않았다.

## 수정 전 재현 기준 · 배포 main

| 단계 | 활성 탭 | 본문 언어 | 결과 |
| --- | --- | --- | --- |
| 시작 | 개역한글 | 한글 | 정상 |
| 원어 클릭 | 개역한글 | 헬라 | 활성 탭 stale |
| WEB 클릭 | 개역한글 | 영어 | 활성 탭 stale |
| 개역한글 복귀 | 개역한글 | 영어 | `translations.krv` 오염 · 데이터 손실 |

## 수정 후 실제 Chromium 4단계 추적

| 단계 | 활성 탭 | 본문 언어 | 본문 앞 40자 |
| --- | --- | --- | --- |
{after_rows}

- 마지막 개역한글 복귀 본문이 `요한이 잡힌 후`로 시작함을 실제 E2E에서 단언했다.
- 각 단계에서 캔버스 탭 `rgb(0, 122, 255)`와 NodeEditor 편집 역본 버튼 `rgb(59, 130, 246)`의 활성 상태를 실제 CSS로 확인했다.

## 사용자 직접 편집과 lastLocalEditRef

- 선택된 개역한글 TipTap 본문 끝에 `[편집보존]`을 실제 키 입력으로 추가했다.
- WEB으로 전환 후 개역한글로 돌아와 해당 입력이 남아 있음을 확인했다.
- 전체 선택 후 굵게와 빨강 서식을 실제 편집 command로 적용하고 탭 왕복 후 `<strong>`과 color span이 유지됨을 확인했다.
- 따라서 `emitUpdate:false`는 프로그램적 `setContent`만 차단하고 실제 키 입력/서식 편집은 계속 update를 발생시켜 저장된다.
- `lastLocalEditRef` 로직은 변경하지 않았고, 연속 입력 marker가 문장 끝에 그대로 남아 keystroke마다 커서가 재설정되는 회귀가 없음을 확인했다.

## 남아 있는 클로저 위험

- `editor.on('update', handler)`는 여전히 렌더 당시 `editData` closure를 잡는다.
- 이번 수정은 구조 리팩터링 없이 프로그램적 `setContent`가 그 stale closure를 깨우는 경로만 제거한다.
- 향후 탭/노드 교체와 동시에 update를 발생시키는 다른 프로그램적 editor command가 추가되면 동일 계열 위험을 다시 검토해야 한다.

## 회귀 테스트

- 신규 `tests/nodeeditor-tab-sync-regression.spec.js`
- 실제 흐름: 신약 → 마가복음 → 1장 → 14~15절 → 본문 불러오기 → 구절 추가 → `.at-canvas-node__title`로 노드 선택 → 원어 → WEB → 개역한글.
- KRV/WEB/GNT 공급 응답만 고정 fixture로 주입하고 React/VerseNode/NodeEditor/Tiptap 상태 흐름은 실제 앱 코드를 사용한다.
- `package.json`의 기존 `test:smoke` 목록에 신규 spec을 추가하여 표준 `browser-smoke`에서 함께 실행되게 했다. workflow 파일은 최종 diff에 남기지 않는다.

## 실행 검증

- `node scripts/verify-translation-switching-stability.mjs` — PASS
- `npm run lint` (oxlint) — PASS (exit 0; 기존 warning만 존재)
- `git diff --check` — PASS
- 신규 selected-node Chromium regression — PASS
- `npm run build` — PASS (전체 prebuild verifier + production build)
- `npm run test:smoke` — PASS (기존 Chromium smoke 전체 + 신규 회귀)

## PR / CI

- Draft PR #389. Ready 전환·병합 없음.
- 이 보고서를 포함한 최종 exact-head의 GitHub PR CI 상태는 PR conversation의 최종 검증 코멘트와 작업 보고에서 함께 기록한다.
- CodeQL check-run이 커넥터에 노출되지 않으면 `확인 불가 — connector/check-run visibility limitation`으로만 판정하고 미실행으로 추정하지 않는다.
'''
          p = Path('bible-mindmap/.pipeline/task5/02-impl.md')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(report, encoding='utf-8')
          PY

      - name: Commit final scoped tree and remove temporary workflow
        run: |
          rm .github/workflows/task5-nodeeditor-tab-sync-runner.yml
          git diff --exit-code ce02c72f1900df882030176176c9b224835f37d7 -- memory/RESUME.json
          actual="$(git diff --name-only ce02c72f1900df882030176176c9b224835f37d7 | sort)"
          expected="$(printf '%s\n' \
            'bible-mindmap/.pipeline/task5/02-impl.md' \
            'bible-mindmap/package.json' \
            'bible-mindmap/src/components/NodeEditor.jsx' \
            'bible-mindmap/tests/nodeeditor-tab-sync-regression.spec.js' | sort)"
          test "$actual" = "$expected" || { echo 'Unexpected final diff'; printf '%s\n' "$actual"; exit 1; }
          git config user.name 'BIBLE_MAP'
          git config user.email 'skyhyangsu63@gmail.com'
          git add -- bible-mindmap/src/components/NodeEditor.jsx bible-mindmap/package.json bible-mindmap/tests/nodeeditor-tab-sync-regression.spec.js bible-mindmap/.pipeline/task5/02-impl.md .github/workflows/task5-nodeeditor-tab-sync-runner.yml
          git diff --cached --check
          git commit -m 'fix(nodeeditor): preserve translation slots on tab sync'
          git push origin HEAD:pipeline/task-nodeeditor-tab-sync
