      - name: Build lexicon fixtures
        working-directory: bible-mindmap
        run: npm run build:lexicon

      - name: Run targeted verifier and oxlint
        working-directory: bible-mindmap
        shell: bash
        run: |
          node scripts/verify-translation-switching-stability.mjs
          npm run lint
          git diff --check

      - name: Run targeted selected-node regression
        working-directory: bible-mindmap
        env:
          TASK5_TRACE_PATH: /tmp/task5-tab-sync-trace.json
        run: npx playwright test tests/nodeeditor-tab-sync-regression.spec.js --project=chromium --reporter=line

      - name: Run full verifier/build
        working-directory: bible-mindmap
        run: npm run build

      - name: Run existing browser smoke plus new regression
        working-directory: bible-mindmap
        run: npm run test:smoke

      - name: Write implementation report
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          trace = json.loads(Path('/tmp/task5-tab-sync-trace.json').read_text(encoding='utf-8'))
          snapshots = trace['snapshots'][:4]
          rows = '\n'.join(
              f"| {item['step']} | {item['activeTab']} | {item['bodyLanguage']} | `{item['prefix40']}` |"
              for item in snapshots
          )
          report = f"""# task5 · 02-impl — NodeEditor 번역 탭 동기화 데이터 손실 수정

## 기준과 범위

- 기준 `main`: `ce02c72f1900df882030176176c9b224835f37d7`
- 브랜치: `pipeline/task-nodeeditor-tab-sync`
- Draft PR: #{os.environ.get('PR_NUMBER', 'unknown')}
- `pipeline/task-hebrew-text-normalize` / PR #388은 읽기·수정·rebase·push 모두 하지 않았다.
- `memory/RESUME.json`은 변경하지 않았다.

## 최소 수정

- `src/components/NodeEditor.jsx`
  1. 노드 선택 해제 시 프로그램적 초기화 `editor.commands.setContent('')`를 `editor.commands.setContent('', {{ emitUpdate: false }})`로 변경했다. 프로그램적 비우기가 사용자 편집 `update` 이벤트로 오인되어 stale `editData`를 저장하지 않게 한다.
  2. 선택 노드/번역 탭 동기화 `editor.commands.setContent(html)`를 `editor.commands.setContent(html, {{ emitUpdate: false }})`로 변경했다. Tiptap v3의 기본 `emitUpdate`로 인해 이전 탭의 closure가 새 탭 HTML을 `translations.krv` 등에 덮어쓰던 경로를 끊는다.
- 상태 구조, update handler closure, Tiptap 버전, 본문 스타일/레이아웃은 리팩터링하지 않았다.

## 수정 후 4단계 실제 브라우저 추적

| 단계 | 활성 탭 | 본문 언어 | 본문 앞 40자 |
| --- | --- | --- | --- |
{rows}

- 마지막 개역한글 복귀는 `요한이 잡힌 후`로 시작함을 실제 Chromium E2E에서 단언했다.
- 각 단계에서 캔버스 탭은 `rgb(0, 122, 255)`, NodeEditor 편집 역본 버튼은 `rgb(59, 130, 246)` 활성 상태를 실제 CSS로 확인했다.

## 사용자 직접 편집 / lastLocalEditRef 확인

- 선택된 개역한글 본문 TipTap에 `[편집보존]`을 실제 키 입력으로 추가했다.
- WEB으로 이동했다가 개역한글로 돌아온 뒤 입력 문자열이 남아 있음을 확인했다.
- 전체 선택 후 굵게와 빨강을 실제 편집 command로 적용하고 탭 왕복 후 `<strong>`과 color span이 유지됨을 확인했다.
- 따라서 `emitUpdate:false`는 프로그램적 `setContent`만 차단하며 실제 키 입력/서식 command의 `update` 저장은 계속 발생한다.
- `lastLocalEditRef` 스킵 가드는 유지했으며, 연속 타이핑 결과가 끝에 정확히 `[편집보존]`으로 남아 keystroke마다 커서가 재설정되는 회귀가 없음을 확인했다.

## 남아 있는 클로저 위험

- `editor.on('update', handler)`는 여전히 렌더 당시 `editData` closure를 사용한다. 이번 수정은 구조를 바꾸지 않고 프로그램적 `setContent`가 그 stale closure를 동기적으로 깨우는 경로만 차단한다.
- 향후 다른 프로그램적 editor command가 `update`를 발생시키면서 동시에 탭/노드 상태를 교체하는 코드가 추가되면 같은 종류의 위험을 다시 검토해야 한다. 이번 과제에서는 요청대로 handler/ref 구조를 리팩터링하지 않았다.

## 회귀 테스트

- 신규 `tests/nodeeditor-tab-sync-regression.spec.js`
  - 신약 → 마가복음 → 1장 → 14~15절 → 본문 불러오기 → 구절 추가 → `.at-canvas-node__title` 클릭으로 노드 선택 → 원어 → WEB → 개역한글을 실제 Chromium UI로 수행한다.
  - KRV/WEB/GNT 공급 응답만 고정 fixture로 주입하고 React/NodeEditor/VerseNode/Tiptap 상태 흐름은 실제 앱 코드를 사용한다.
  - 활성 탭 CSS, 언어, KRV 복귀 문자열, 직접 편집, 굵게/색상 보존을 모두 단언한다.
- `package.json`의 기존 `test:smoke`에 신규 spec을 추가했다. workflow 파일은 최종 diff에 남기지 않는다.

