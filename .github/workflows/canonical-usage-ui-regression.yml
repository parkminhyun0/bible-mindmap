name: Canonical usage UI regression

on:
  pull_request:
    paths:
      - 'bible-mindmap/tests/canonical-usage-map.spec.js'
      - 'bible-mindmap/src/components/CanonicalConcept*.jsx'
      - 'bible-mindmap/src/data/canonicalConcepts*.js'
      - 'bible-mindmap/src/data/canonicalUsageMap*.js'
      - '.github/workflows/canonical-usage-ui-regression.yml'
  push:
    branches: [main]
    paths:
      - 'bible-mindmap/tests/canonical-usage-map.spec.js'
      - 'bible-mindmap/src/components/CanonicalConcept*.jsx'
      - 'bible-mindmap/src/data/canonicalConcepts*.js'
      - 'bible-mindmap/src/data/canonicalUsageMap*.js'

permissions:
  contents: read

jobs:
  canonical-usage-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bible-mindmap
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Strong and lexicon definitions
        run: npm run build:lexicon
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: node -e "const p=require('./node_modules/playwright/package.json'); console.log('version='+p.version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('bible-mindmap/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
      - name: Report Playwright browser cache
        run: echo "cache-hit=${{ steps.playwright-browser-cache.outputs.cache-hit }}"
      - name: Configure apt network bounds for Playwright dependencies
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99playwright-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
      - name: Ensure Playwright system dependencies
        shell: bash
        timeout-minutes: 8
        run: |
          if npx playwright install-deps --dry-run chromium; then
            echo "Playwright system dependencies already satisfied; skipping apt install."
            exit 0
          fi

          for attempt in 1 2; do
            echo "Playwright dependency install attempt ${attempt}/2"
            if npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 5
            fi
          done
          exit 1
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Run all 72 canonical concept UI regressions
        run: npx playwright test tests/canonical-usage-map.spec.js --project=chromium
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-usage-ui-failure
          path: |
            bible-mindmap/playwright-report
            bible-mindmap/test-results
          if-no-files-found: ignore
