name: A5 one-time modal boundary test stabilization

on:
  push:
    branches:
      - chatgpt/a5-security-deploy-audit
    paths:
      - .github/workflows/a5-stabilize-modal-boundary-test.yml

permissions:
  contents: write

jobs:
  stabilize-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/a5-security-deploy-audit
      - name: Wait for the mobile modal entrance animation before asserting bounds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bible-mindmap/tests/p1-modal-accessibility.spec.js')
          source = path.read_text()
          old = """    const bounds = await dialog.boundingBox();
    expect(bounds).not.toBeNull();
    expect(bounds.x).toBeGreaterThanOrEqual(-SUBPIXEL_TOLERANCE);
    expect(bounds.y).toBeGreaterThanOrEqual(-SUBPIXEL_TOLERANCE);
    expect(bounds.x + bounds.width).toBeLessThanOrEqual(390 + SUBPIXEL_TOLERANCE);
    expect(bounds.y + bounds.height).toBeLessThanOrEqual(844 + SUBPIXEL_TOLERANCE);
    await assertFocusCycle(page, dialog);
"""
          new = """    // The shell has a short translateY entrance animation. Assert the final
    // layout boundary rather than sampling an intermediate animation frame.
    await expect.poll(async () => {
      const bounds = await dialog.boundingBox();
      return Boolean(bounds
        && bounds.x >= -SUBPIXEL_TOLERANCE
        && bounds.y >= -SUBPIXEL_TOLERANCE
        && bounds.x + bounds.width <= 390 + SUBPIXEL_TOLERANCE
        && bounds.y + bounds.height <= 844 + SUBPIXEL_TOLERANCE);
    }).toBe(true);
    await assertFocusCycle(page, dialog);
"""
          if old not in source:
              raise SystemExit('Mobile modal boundary assertion anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit stabilized regression contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible-mindmap/tests/p1-modal-accessibility.spec.js
          git commit -m "test: assert mobile modal bounds after entrance animation"
          git push origin HEAD:chatgpt/a5-security-deploy-audit
