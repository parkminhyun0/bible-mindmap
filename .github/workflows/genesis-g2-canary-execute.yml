name: Genesis G2 Canary Execute

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '실행 승인 문자열: RUN-GENESIS-G2-CANARY'
        required: true
        type: string
      provider:
        description: '실행 provider'
        required: true
        default: both
        type: choice
        options:
          - both
          - nvidia
          - openai
      kill_switch:
        description: '실행하려면 명시적으로 off 선택'
        required: true
        default: on
        type: choice
        options:
          - on
          - off
      nvidia_model_id:
        description: 'NVIDIA model ID (provider가 nvidia/both일 때 필요)'
        required: false
        type: string
      openai_model_id:
        description: 'OpenAI model ID (provider가 openai/both일 때 필요)'
        required: false
        type: string

permissions:
  contents: read

env:
  GENESIS_G2_TRANSLATION_EXECUTION_ENABLED: '1'
  LEXICON_TRANSLATION_KILL_SWITCH: ${{ inputs.kill_switch == 'off' && '0' || '1' }}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm explicit execution approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROVIDER: ${{ inputs.provider }}
          KILL_SWITCH: ${{ inputs.kill_switch }}
          NVIDIA_MODEL_INPUT: ${{ inputs.nvidia_model_id }}
          OPENAI_MODEL_INPUT: ${{ inputs.openai_model_id }}
          NVIDIA_API_KEY_PRESENT: ${{ secrets.NVIDIA_API_KEY != '' }}
          OPENAI_API_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          test "$CONFIRMATION" = 'RUN-GENESIS-G2-CANARY' || { echo '승인 문자열 불일치'; exit 1; }
          test "$KILL_SWITCH" = 'off' || { echo 'kill switch가 켜져 있음'; exit 1; }
          if [ "$PROVIDER" = 'nvidia' ] || [ "$PROVIDER" = 'both' ]; then
            test -n "$NVIDIA_MODEL_INPUT" || { echo 'NVIDIA model ID 누락'; exit 1; }
            test "$NVIDIA_API_KEY_PRESENT" = 'true' || { echo 'NVIDIA_API_KEY secret 누락'; exit 1; }
          fi
          if [ "$PROVIDER" = 'openai' ] || [ "$PROVIDER" = 'both' ]; then
            test -n "$OPENAI_MODEL_INPUT" || { echo 'OpenAI model ID 누락'; exit 1; }
            test "$OPENAI_API_KEY_PRESENT" = 'true' || { echo 'OPENAI_API_KEY secret 누락'; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Rebuild Genesis source packets and canary set
        working-directory: bible-mindmap
        run: |
          node scripts/report-genesis-strong-inventory.mjs --strict --write=reports/genesis-strong-inventory.json
          node scripts/build-genesis-translation-manifest.mjs
          node scripts/verify-genesis-translation-contract.mjs --strict
          node scripts/build-genesis-g2-calibration-batch.mjs
          node scripts/verify-genesis-g2-calibration-batch.mjs --strict
          node scripts/materialize-genesis-g2-bdb-packets.mjs
          node scripts/verify-genesis-g2-bdb-packets.mjs --strict
          node scripts/build-genesis-g2-canary-set.mjs
          node scripts/verify-genesis-g2-canary-set.mjs

      - name: Execute selected blind canaries
        working-directory: bible-mindmap
        env:
          PROVIDER: ${{ inputs.provider }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL_ID: ${{ inputs.nvidia_model_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_ID: ${{ inputs.openai_model_id }}
        run: |
          STRONGS="$(node scripts/build-genesis-g2-canary-set.mjs --print-strongs)"
          run_provider() {
            provider="$1"
            for strong in $STRONGS; do
              node scripts/ai/lexicon/run-genesis-g2-blind-translation.mjs \
                --provider="$provider" \
                --execute \
                --retry-failed \
                --max-attempts=3 \
                --delay-ms=1200 \
                --strong="$strong" \
                --output-root=reports/genesis-g2-canary-execution
            done
          }
          if [ "$PROVIDER" = 'nvidia' ] || [ "$PROVIDER" = 'both' ]; then run_provider nvidia; fi
          if [ "$PROVIDER" = 'openai' ] || [ "$PROVIDER" = 'both' ]; then run_provider openai; fi

      - name: Verify generated canary candidates
        working-directory: bible-mindmap
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          case "$PROVIDER" in
            both) REQUIRED='nvidia,openai' ;;
            nvidia) REQUIRED='nvidia' ;;
            openai) REQUIRED='openai' ;;
            *) exit 1 ;;
          esac
          node scripts/verify-genesis-g2-canary-set.mjs \
            --require-candidates="$REQUIRED" \
            --output-root=reports/genesis-g2-canary-execution

      - name: Publish canary summary
        if: always()
        working-directory: bible-mindmap
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const canaryPath = 'reports/genesis-g2-canary-set.json'
          const lines = ['## 창세기 G2-3 · 5개 canary 실제 후보 실행']
          if (!fs.existsSync(canaryPath)) {
            lines.push('- canary manifest: **미생성**')
          } else {
            const data = JSON.parse(fs.readFileSync(canaryPath, 'utf8'))
            lines.push(`- Strong: **${data.items.map((item) => item.strong).join(', ')}**`)
            lines.push(`- source nodes: **${data.counts.sourceNodes}개**`)
          }
          lines.push(`- provider 요청: **${process.env.PROVIDER}**`)
          lines.push('- 서비스 데이터 쓰기: **차단**')
          lines.push('- 최종 승인: **차단**')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genesis-g2-canary-execution-${{ inputs.provider }}
          path: |
            bible-mindmap/reports/genesis-g2-canary-set.json
            bible-mindmap/reports/genesis-g2-canary-execution/envelopes/
            bible-mindmap/reports/genesis-g2-canary-execution/candidates/
            bible-mindmap/reports/genesis-g2-canary-execution/ledgers/
            bible-mindmap/reports/genesis-g2-canary-execution/summaries/
          if-no-files-found: warn
          retention-days: 14
