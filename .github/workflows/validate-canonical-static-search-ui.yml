name: Validate Canonical Static Search UI

on:
  pull_request:
    paths:
      - 'bible-mindmap/src/components/CanonicalConceptStaticSearchEntry.jsx'
      - 'bible-mindmap/src/components/CanonicalConceptLauncher.jsx'
      - 'bible-mindmap/scripts/verify-canonical-static-search-ui.mjs'
      - '.github/workflows/validate-canonical-static-search-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-search-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify server-free static search UI contract
        working-directory: bible-mindmap
        run: node scripts/verify-canonical-static-search-ui.mjs
