name: Verify RESUME checkpoint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: resume-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-resume-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate checkpoint structure, freshness, and PR state
        working-directory: bible-mindmap
        env:
          CHECKPOINT_REQUIRE_REMOTE: '1'
          RESUME_MAX_AGE_HOURS: '12'
        run: node scripts/verify-resume-checkpoint.mjs
