name: Lexicon v4 Review Coordinator

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to inspect
        required: false
  check_suite:
    types: [completed]
  workflow_run:
    workflows:
      - Lexicon v4 Foundation
      - Validate pull request
      - Verify RESUME checkpoint
      - Genesis P5 Gold Set Contract
      - Genesis P5 GPT Candidate Contract
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lexicon-v4-review-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Self-test derived state contract
        working-directory: bible-mindmap
        run: node scripts/derive-lexicon-runtime-state.mjs --self-test
      - name: Coordinate exact-head independent review
        uses: actions/github-script@v9
        env:
          EXPLICIT_PR: ${{ inputs.pr_number || '' }}
          FALLBACK_REVIEWER: ${{ vars.LEXICON_FALLBACK_REVIEWER }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const PRIMARY = 'bible-mindmap-review';
            const FALLBACK = (process.env.FALLBACK_REVIEWER || '').trim();
            const LABEL = 'lexicon-v4-auto-merge-eligible';
            const HEARTBEAT_MARKER = '[lexicon-review-heartbeat]';
            const HEARTBEAT_TTL_MS = 10 * 60 * 1000;
            const REQUIRED = new Set(['v4 foundation contract','v4 consensus gate self-test','v4 universal registry regression','v4 golden audit sample contract','v4 auto-merge decision dry-run','verify-and-build','security-audit','verify-resume-checkpoint','fingerprint','verify-gpt-candidates']);
            const explicit = Number(process.env.EXPLICIT_PR || 0);
            let prs = [];
            if (explicit) prs = [(await github.rest.pulls.get({ owner, repo, pull_number: explicit })).data];
            else {
              prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              prs = prs.filter((pr) => (pr.labels || []).some((l) => l.name === LABEL));
            }
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function latestReviews(prNumber) { const reviews = await github.paginate(github.rest.pulls.listReviews,{owner,repo,pull_number:prNumber,per_page:100}); const latest=new Map(); for(const r of reviews) latest.set(r.user?.login,r); return latest; }
            function approvedOnHead(latest,head){ for(const login of [PRIMARY,FALLBACK].filter(Boolean)){const r=latest.get(login); if(r?.state==='APPROVED'&&r?.commit_id===head)return login;} return null; }
            async function activeHeartbeat(prNumber,head){const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:prNumber,per_page:100}); const now=Date.now(); return comments.find((c)=>{const login=c.user?.login||''; if(![PRIMARY,FALLBACK].filter(Boolean).includes(login))return false; const body=c.body||''; if(!body.includes(HEARTBEAT_MARKER)||!body.includes(head))return false; const t=Date.parse(c.updated_at||c.created_at||''); return Number.isFinite(t)&&now-t<=HEARTBEAT_TTL_MS;})||null;}
            function promotionSensitive(pr){
              const labels=new Set((pr.labels||[]).map((l)=>String(l.name||'').toLowerCase()));
              if(labels.has('human-gate-required')||labels.has('theology-sensitive')||labels.has('lexicon-promotion')) return true;
              const text=`${pr.title||''}\n${pr.body||''}`;
              const auditOnly=/audit-only|registry\s*\/\s*production write\s*0|candidate\/registry mutation\s*0|promotion 금지/i.test(text);
              if(auditOnly) return false;
              return /Approval Registry.*(promot|승격|write|변경)|production write|existing approved meaning.*(change|변경)|human gate required|golden audit halt|license conflict/i.test(text);
            }
            async function allRequiredGreen(head){const runs=await github.paginate(github.rest.checks.listForRef,{owner,repo,ref:head,per_page:100});const latest=new Map();for(const cr of runs){if(!REQUIRED.has(cr.name))continue;const prev=latest.get(cr.name);if(!prev||(cr.started_at||'')>(prev.started_at||''))latest.set(cr.name,cr);}for(const name of REQUIRED){const cr=latest.get(name);if(!cr||cr.status!=='completed'||!['success','neutral','skipped'].includes(cr.conclusion))return false;}return true;}
            async function ensureIssue(prNumber,head,reason){const short=head.slice(0,7);const title=`LEXICON REVIEW FALLBACK · PR #${prNumber} · ${short}`;const q=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});const existing=q.find((i)=>i.title===title);const record=[`- time: ${new Date().toISOString()}`,`- exact head: ${head}`,`- reason: ${reason}`,`- primary reviewer: ${PRIMARY}`,`- fallback reviewer: ${FALLBACK||'(not configured)'}`,'- Safety: no self-approval; no quality-gate bypass; exact-head approval remains required.'].join('\n');if(existing){await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body:record});return existing.number;}return (await github.rest.issues.create({owner,repo,title,body:['Machine-generated review fallback record.','',record].join('\n')})).data.number;}
            for(const pr of prs){
              if(pr.state!=='open'||pr.draft)continue; const head=pr.head.sha;
              if(!(await allRequiredGreen(head))){core.info(`#${pr.number}: required CI not all green yet`);continue;}
              let latest=await latestReviews(pr.number); let reviewer=approvedOnHead(latest,head); if(reviewer){core.notice(`#${pr.number}: exact-head approval already present from ${reviewer}`);continue;}
              const earlyHeartbeat=await activeHeartbeat(pr.number,head); if(earlyHeartbeat){core.notice(`#${pr.number}: active review heartbeat from ${earlyHeartbeat.user.login}`);continue;}
              core.notice(`#${pr.number}: all required CI green and no heartbeat; starting 3-minute no-signal SLA at ${head}`); await sleep(180000);
              const fresh=(await github.rest.pulls.get({owner,repo,pull_number:pr.number})).data; if(fresh.state!=='open'||fresh.head.sha!==head)continue;
              latest=await latestReviews(pr.number); reviewer=approvedOnHead(latest,head); if(reviewer)continue; const heartbeat=await activeHeartbeat(pr.number,head); if(heartbeat)continue;
              try{await github.rest.pulls.requestReviewers({owner,repo,pull_number:pr.number,reviewers:[PRIMARY]});}catch(e){core.warning(`primary re-request failed: ${e.message}`);}
              const sensitive=promotionSensitive(fresh); let reason='primary review exceeded 3-minute no-signal SLA';
              if(sensitive){reason+='; promotion/human-gate scope detected, automatic fallback reviewer request suppressed';core.warning(`#${pr.number}: promotion/human-gate scope; fallback reviewer suppressed`);}
              else if(FALLBACK&&FALLBACK!==PRIMARY){try{await github.rest.pulls.requestReviewers({owner,repo,pull_number:pr.number,reviewers:[FALLBACK]});reason+='; fallback requested';}catch(e){reason+=`; fallback request failed: ${e.message}`;}}
              else reason+='; fallback reviewer not configured';
              try{await github.rest.repos.createDispatchEvent({owner,repo,event_type:'lexicon_review_fallback_required',client_payload:{pr_number:pr.number,head_sha:head,primary_reviewer:PRIMARY,fallback_reviewer:sensitive?null:(FALLBACK||null),promotion_sensitive:sensitive,reason}});}catch(e){core.warning(`repository_dispatch fallback signal failed: ${e.message}`);}
              const issue=await ensureIssue(pr.number,head,reason); core.setFailed(`#${pr.number}: REVIEW_TIMEOUT/no-signal. DLQ #${issue}; exact-head independent approval remains required.`);
            }
