name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  status-start:
    name: pages-deploy-status-start
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment pending status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'pages-deploy-pipeline',
              description: 'GitHub Pages build and live verification are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  build:
    needs: status-start
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency integrity
        run: npm run verify:dependency-integrity

      - name: Block production high and critical vulnerabilities
        shell: bash
        run: |
          mkdir -p reports/security
          set +e
          npm audit --omit=dev --json > reports/security/npm-audit-production.json
          audit_exit=$?
          set -e
          if [ "$audit_exit" -gt 1 ]; then
            echo "::error::npm audit service failed (${audit_exit})"
            exit 2
          fi
          node scripts/summarize-npm-audit.mjs \
            --input=reports/security/npm-audit-production.json \
            --label=production-deploy \
            --fail-on=high

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: bible-mindmap/reports/security/npm-audit-production.json
          if-no-files-found: error
          retention-days: 30

      # Playwright의 webServer는 `npm run dev`를 실행하며 predev 전수 검증을 거친다.
      # 따라서 브라우저 회귀 검사보다 먼저 원어 corpus를 생성해야 테스트 서버가 정상 기동한다.
      - name: Build lexicon data (STEPBible TAGNT + TAHOT)
        run: node scripts/build-lexicon.mjs

      - name: Install Chromium for browser regression tests
        run: npx playwright install chromium

      - name: Run desktop, mobile, tablet, and modal smoke tests
        run: npm run test:smoke

      - name: Build complete OT/NT biblical places database
        run: npm run build:places

      - name: Build SBLGNT apparatus variants (NT 사본 이문 JSON)
        run: node scripts/parse-sblgnt.mjs

      - name: Build OSHB Ketiv/Qere variants (OT 마소라 K/Q 자동 이문)
        run: node scripts/parse-oshb.mjs

      - name: Build SP-MT variants (오경 사마리아 vs 마소라 자동 대조 · scripts/data/sp-verses.json 사용)
        run: node scripts/parse-sp-mt.mjs

      - name: Build LXX-MT variants (39권 OT 셉투아긴트 vs 마소라 구조 자동 대조)
        run: node scripts/parse-lxx-mt.mjs

      - name: Build app
        run: npm run build

      - name: Guard — 빌드가 tracked 소스를 변형하지 않았는지 확인 (안티패턴 방지)
        run: node scripts/guard-no-source-mutation.mjs

      - name: Copy landing pages to dist root
        run: |
          cp -r landing/. dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bible-mindmap/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: verify:deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Verify live commit matches deployed HEAD
        id: verify_live
        working-directory: bible-mindmap
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "verify:deploy attempt ${attempt}/8"
            if npm run verify:deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Publish verify:deploy commit status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pages-verify-deploy',
              description: state === 'success'
                ? 'Live version.json matches this commit'
                : 'Live deployment verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  status-final:
    name: pages-deploy-status-final
    if: always()
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final pipeline status
        uses: actions/github-script@v9
        with:
          script: |
            const build = '${{ needs.build.result }}';
            const deploy = '${{ needs.deploy.result }}';
            const verify = '${{ needs.verify.result }}';
            const state = verify === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Build, Pages deployment, and live SHA verification succeeded'
              : `Deployment failed: build=${build}, deploy=${deploy}, verify=${verify}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pages-deploy-pipeline',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  notion:
    name: notion-live-update
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update Notion CI 자동 배포 로그
        working-directory: bible-mindmap
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_CI_LOG_BLOCK: ${{ vars.NOTION_CI_LOG_BLOCK }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notion-live-update.mjs
