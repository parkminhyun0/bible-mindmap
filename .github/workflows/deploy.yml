name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bible-mindmap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build lexicon data (STEPBible TAGNT + TAHOT)
        run: node scripts/build-lexicon.mjs

      - name: Build complete OT/NT biblical places database
        run: npm run build:places

      - name: Build SBLGNT apparatus variants (NT 사본 이문 JSON)
        run: node scripts/parse-sblgnt.mjs

      - name: Build OSHB Ketiv/Qere variants (OT 마소라 K/Q 자동 이문)
        run: node scripts/parse-oshb.mjs

      - name: Build SP-MT variants (오경 사마리아 vs 마소라 자동 대조 · scripts/data/sp-verses.json 사용)
        run: node scripts/parse-sp-mt.mjs

      - name: Build LXX-MT variants (39권 OT 셉투아긴트 vs 마소라 구조 자동 대조)
        run: node scripts/parse-lxx-mt.mjs

      - name: Build app
        run: npm run build

      - name: Guard — 빌드가 tracked 소스를 변형하지 않았는지 확인 (안티패턴 방지)
        run: node scripts/guard-no-source-mutation.mjs

      - name: Copy landing pages to dist root
        run: |
          cp -r landing/. dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bible-mindmap/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: verify:deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify live commit matches deployed HEAD
        id: verify_live
        working-directory: bible-mindmap
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "verify:deploy attempt ${attempt}/8"
            if npm run verify:deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Publish verify:deploy commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pages-verify-deploy',
              description: state === 'success'
                ? 'Live version.json matches this commit'
                : 'Live deployment verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
