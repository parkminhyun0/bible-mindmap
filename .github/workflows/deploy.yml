name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  status-start:
    name: pages-deploy-status-start
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment pending status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'pages-deploy-pipeline',
              description: 'GitHub Pages build and live verification are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  build:
    needs: status-start
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bible-mindmap
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency integrity
        run: npm run verify:dependency-integrity

      - name: Block production high and critical vulnerabilities
        shell: bash
        run: |
          mkdir -p reports/security
          set +e
          npm audit --omit=dev --json > reports/security/npm-audit-production.json
          audit_exit=$?
          set -e
          if [ "$audit_exit" -gt 1 ]; then
            echo "::error::npm audit service failed (${audit_exit})"
            exit 2
          fi
          node scripts/summarize-npm-audit.mjs \
            --input=reports/security/npm-audit-production.json \
            --label=production-deploy \
            --fail-on=high

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: bible-mindmap/reports/security/npm-audit-production.json
          if-no-files-found: error
          retention-days: 30

      # Playwright의 webServer는 `npm run dev`를 실행하며 predev 전수 검증을 거친다.
      # 따라서 브라우저 회귀 검사보다 먼저 원어 corpus를 생성해야 테스트 서버가 정상 기동한다.
      - name: Build lexicon data (STEPBible TAGNT + TAHOT)
        run: node scripts/build-lexicon.mjs

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: node -e "const p=require('./node_modules/playwright/package.json'); console.log('version='+p.version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('bible-mindmap/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Report Playwright browser cache
        run: echo "cache-hit=${{ steps.playwright-browser-cache.outputs.cache-hit }}"

      - name: Install Chromium for browser regression tests
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Run desktop, mobile, tablet, and modal smoke tests
        run: npm run test:smoke

      - name: Build complete OT/NT biblical places database
        run: npm run build:places

      - name: Build SBLGNT apparatus variants (NT 사본 이문 JSON)
        run: node scripts/parse-sblgnt.mjs

      - name: Build OSHB Ketiv/Qere variants (OT 마소라 K/Q 자동 이문)
        run: node scripts/parse-oshb.mjs

      - name: Build SP-MT variants (오경 사마리아 vs 마소라 자동 대조 · scripts/data/sp-verses.json 사용)
        run: node scripts/parse-sp-mt.mjs

      - name: Build LXX-MT variants (39권 OT 셉투아긴트 vs 마소라 구조 자동 대조)
        run: node scripts/parse-lxx-mt.mjs

      # 대용량 정적 데이터(lex·strongs·strongs-def·variants·places DB)는 data-dist 브랜치에
      # 발행되어 jsDelivr CDN 으로 서빙된다. 앱 빌드에 그 CDN 베이스를 주입한다.
      - name: Resolve data-dist CDN base
        run: |
          DATA_SHA="$(git ls-remote origin data-dist | cut -f1)"
          if [ -z "$DATA_SHA" ]; then
            echo "::error::data-dist 브랜치를 찾을 수 없음 — 데이터 발행(publish-data) 필요"
            exit 1
          fi
          echo "VITE_DATA_BASE_URL=https://cdn.jsdelivr.net/gh/${{ github.repository }}@${DATA_SHA}/" >> "$GITHUB_ENV"
          echo "data-dist SHA: ${DATA_SHA}"

      - name: Build app
        run: npm run build

      - name: Guard — 빌드가 tracked 소스를 변형하지 않았는지 확인 (안티패턴 방지)
        run: node scripts/guard-no-source-mutation.mjs

      - name: Copy landing pages to dist root
        run: |
          cp -r landing/. dist/
          node scripts/inject-landing-data-sources.mjs
          grep -q 'id="data-sources"' dist/index.html
          touch dist/.nojekyll

      # CDN 으로 오프로드한 대용량 데이터를 Pages 아티팩트에서 제외해 경량화한다.
      # (앱은 jsDelivr 에서 fetch. places.json fallback·context 등 소용량은 유지)
      - name: Offload large data to CDN (trim Pages artifact)
        run: |
          rm -rf dist/app/data/lex dist/app/data/strongs dist/app/data/strongs-def dist/app/data/variants
          rm -f dist/app/data/biblical-places-db.json
          echo "trimmed dist size:"; du -sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bible-mindmap/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          # deploy-pages@v4 최대 허용치(10분). 이전의 1800000은 자동 캡되어 무효였음.
          timeout: 600000
          error_count: 20

  verify:
    name: verify:deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Verify live commit matches deployed HEAD
        id: verify_live
        working-directory: bible-mindmap
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "verify:deploy attempt ${attempt}/8"
            if npm run verify:deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Publish verify:deploy commit status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pages-verify-deploy',
              description: state === 'success'
                ? 'Live version.json matches this commit'
                : 'Live deployment verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  status-final:
    name: pages-deploy-status-final
    if: always()
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final pipeline status
        uses: actions/github-script@v9
        with:
          script: |
            const build = '${{ needs.build.result }}';
            const deploy = '${{ needs.deploy.result }}';
            const verify = '${{ needs.verify.result }}';
            const state = verify === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Build, Pages deployment, and live SHA verification succeeded'
              : `Deployment failed: build=${build}, deploy=${deploy}, verify=${verify}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pages-deploy-pipeline',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  notion:
    name: notion-live-update
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update Notion CI 자동 배포 로그
        working-directory: bible-mindmap
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_CI_LOG_BLOCK: ${{ vars.NOTION_CI_LOG_BLOCK }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notion-live-update.mjs
