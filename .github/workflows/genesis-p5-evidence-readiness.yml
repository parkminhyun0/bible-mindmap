name: Genesis P5 Evidence Readiness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/genesis-p5-evidence-readiness.yml'
      - '.github/workflows/genesis-p5-gold-set.yml'
      - 'bible-mindmap/scripts/build-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/build-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/approval-registry.json'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/genesis-p5-evidence-readiness.yml'
      - '.github/workflows/genesis-p5-gold-set.yml'
      - 'bible-mindmap/scripts/build-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/build-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/approval-registry.json'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'

permissions:
  contents: read

concurrency:
  group: genesis-p5-evidence-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-evidence-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Rebuild and verify Genesis Gold 25
        working-directory: bible-mindmap
        run: |
          node scripts/report-genesis-strong-inventory.mjs --strict --write=reports/genesis-strong-inventory.json
          node scripts/build-genesis-p5-gold-set.mjs
          node scripts/verify-genesis-p5-gold-set.mjs --strict

      - name: Fetch pinned OpenScriptures BDB and STEPBible TAHOT sources
        working-directory: bible-mindmap
        run: |
          set -euo pipefail
          mkdir -p .cache/lexicon/openscriptures .cache/lexicon/stepbible
          BDB_BASE='https://raw.githubusercontent.com/openscriptures/HebrewLexicon/21c9add13bc727d3a951361778e97e3ff7afd1ce'
          curl --fail --silent --show-error --location "$BDB_BASE/BrownDriverBriggs.xml" --output .cache/lexicon/openscriptures/BrownDriverBriggs.xml
          curl --fail --silent --show-error --location "$BDB_BASE/LexicalIndex.xml" --output .cache/lexicon/openscriptures/LexicalIndex.xml
          TAHOT_URL='https://raw.githubusercontent.com/STEPBible/STEPBible-Data/b86d26cdb1f51729e73b5b4eb7f7ccadc5dfba39/Translators%20Amalgamated%20OT%2BNT/TAHOT%20Gen-Deu%20-%20Translators%20Amalgamated%20Hebrew%20OT%20-%20STEPBible.org%20CC%20BY.txt'
          curl --fail --silent --show-error --location "$TAHOT_URL" --output .cache/lexicon/stepbible/TAHOT-Gen-Deu.txt

      - name: Build Gold 25 source evidence readiness
        working-directory: bible-mindmap
        run: node scripts/build-genesis-p5-evidence-readiness.mjs

      - name: Publish P5 readiness diagnostics
        working-directory: bible-mindmap
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('reports/genesis-p5-evidence-readiness.json', 'utf8'))
          const lines = [
            '## P5 · 창세기 Gold 25 Evidence readiness',
            '',
            `- base Gold ready: **${report.counts.ready}/${report.counts.selected}**`,
            `- candidate base targets ready: **${report.counts.candidateTargetsReady}/${report.counts.candidateTargets}**`,
            `- source units: **${report.counts.sourceUnits}** · candidate units: **${report.counts.candidateUnits}**`,
            `- Extended Strong resolved base items: **${report.counts.extendedResolvedItems}**`,
            `- H776 regression: **${report.h776Regression.approvedSenseCount}/26** · retranslation=false`,
            `- BDB source nodes: **${report.counts.sourceNodes}**`,
            `- candidate generation eligible: **${report.governance.candidateGenerationEligible}**`,
            `- candidate generation allowed: **${report.governance.candidateGenerationAllowed}**`,
            '- Registry/UI/production write: **false**',
            '',
            '### Extended Strong resolution',
            ...report.extendedStrongResolution.map((item) => `- ${item.baseStrong} → ${item.resolvedStrongs.join(', ')} · TAHOT=${item.tahotStrongs.join(', ')} · occurrences=${item.occurrenceCount}`),
            '',
            '### Gold 25 source readiness',
            ...report.items.map((item) => `- ${item.strong} · ${item.group} · ${item.readinessStatus} · units=${item.sourceUnits.length} · nodes=${item.sourceTree?.nodeCount || 0}${item.blocker ? ` · ${item.blocker}` : ''}`),
          ]
          const summary = lines.join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`)
          console.log(summary)
          NODE

      - name: Verify Evidence readiness and closed write Gates
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-p5-evidence-readiness.mjs --strict

      - name: Guard tracked source integrity
        run: git diff --exit-code
