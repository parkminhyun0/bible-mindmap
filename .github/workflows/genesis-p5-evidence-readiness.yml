name: Genesis P5 Evidence Readiness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/genesis-p5-evidence-readiness.yml'
      - '.github/workflows/genesis-p5-gold-set.yml'
      - 'bible-mindmap/scripts/build-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/build-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/approval-registry.json'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/genesis-p5-evidence-readiness.yml'
      - '.github/workflows/genesis-p5-gold-set.yml'
      - 'bible-mindmap/scripts/build-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-gold-set.mjs'
      - 'bible-mindmap/scripts/build-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/verify-genesis-p5-evidence-readiness.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/approval-registry.json'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'

permissions:
  contents: read

concurrency:
  group: genesis-p5-evidence-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-evidence-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Rebuild and verify Genesis Gold 25
        working-directory: bible-mindmap
        run: |
          node scripts/report-genesis-strong-inventory.mjs --strict --write=reports/genesis-strong-inventory.json
          node scripts/build-genesis-p5-gold-set.mjs
          node scripts/verify-genesis-p5-gold-set.mjs --strict

      - name: Fetch pinned OpenScriptures BDB source files
        working-directory: bible-mindmap
        run: |
          set -euo pipefail
          mkdir -p .cache/lexicon/openscriptures
          BASE='https://raw.githubusercontent.com/openscriptures/HebrewLexicon/21c9add13bc727d3a951361778e97e3ff7afd1ce'
          curl --fail --silent --show-error --location "$BASE/BrownDriverBriggs.xml" --output .cache/lexicon/openscriptures/BrownDriverBriggs.xml
          curl --fail --silent --show-error --location "$BASE/LexicalIndex.xml" --output .cache/lexicon/openscriptures/LexicalIndex.xml

      - name: Build Gold 25 source evidence readiness
        working-directory: bible-mindmap
        run: node scripts/build-genesis-p5-evidence-readiness.mjs

      - name: Verify Evidence readiness and closed write Gates
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-p5-evidence-readiness.mjs --strict

      - name: Publish P5 readiness summary
        working-directory: bible-mindmap
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('reports/genesis-p5-evidence-readiness.json', 'utf8'))
          const lines = [
            '## P5 · 창세기 Gold 25 Evidence readiness',
            '',
            `- source tree ready: **${report.counts.ready}/${report.counts.selected}**`,
            `- candidate targets ready: **${report.counts.candidateTargetsReady}/${report.counts.candidateTargets}**`,
            `- H776 regression: **${report.h776Regression.approvedSenseCount}/26** · retranslation=false`,
            `- source nodes: **${report.counts.sourceNodes}**`,
            `- candidate generation eligible: **${report.governance.candidateGenerationEligible}**`,
            `- candidate generation allowed: **${report.governance.candidateGenerationAllowed}**`,
            '- Registry/UI/production write: **false**',
            '',
            '### Gold 25 source readiness',
            ...report.items.map((item) => `- ${item.strong} · ${item.group} · ${item.readinessStatus} · nodes=${item.sourceTree?.nodeCount || 0} · ${item.lexicalIdentity?.lemma || 'unresolved'}`),
          ]
          const summary = lines.join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`)
          console.log(summary)
          NODE

      - name: Guard tracked source integrity
        run: git diff --exit-code
