name: Lexicon Parser Contract

on:
  pull_request:
    paths:
      - 'bible-mindmap/data/lexicon/schemas/BdbParserInput.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/BdbParserOutput.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/H776SourceTreeDiff.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/SourceGoldenReconciliation.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/SourceDriverReport.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/StrongIdentity.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/EvidencePacket.schema.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.parser-input.v1.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.openscriptures-source-input.v1.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.evidence-packet.v2.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.source-golden-reconciliation.v1.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/src/data/lexiconTranslationPilot.js'
      - 'bible-mindmap/scripts/build-h776-parser-adapter.mjs'
      - 'bible-mindmap/scripts/build-h776-evidence-packet-v2.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-adapters.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/scripts/verify-h776-source-golden-reconciliation.mjs'
      - 'bible-mindmap/scripts/verify-h776-evidence-regeneration.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-evidence-contracts.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-parser-contract.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-source-driver.mjs'
      - 'bible-mindmap/scripts/verify-openscriptures-bdb-adapter.mjs'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
      - '.github/workflows/lexicon-parser-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'bible-mindmap/data/lexicon/schemas/BdbParserInput.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/BdbParserOutput.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/H776SourceTreeDiff.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/SourceGoldenReconciliation.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/SourceDriverReport.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/StrongIdentity.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/EvidencePacket.schema.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.parser-input.v1.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.openscriptures-source-input.v1.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.evidence-packet.v2.json'
      - 'bible-mindmap/data/lexicon/fixtures/GEN-1-1-H776.source-golden-reconciliation.v1.json'
      - 'bible-mindmap/data/lexicon/source-driver-policy.json'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/src/data/lexiconTranslationPilot.js'
      - 'bible-mindmap/scripts/build-h776-parser-adapter.mjs'
      - 'bible-mindmap/scripts/build-h776-evidence-packet-v2.mjs'
      - 'bible-mindmap/scripts/build-openscriptures-bdb-adapter.mjs'
      - 'bible-mindmap/scripts/lexicon-source-adapters.mjs'
      - 'bible-mindmap/scripts/lexicon-source-driver.mjs'
      - 'bible-mindmap/scripts/verify-h776-source-golden-reconciliation.mjs'
      - 'bible-mindmap/scripts/verify-h776-evidence-regeneration.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-evidence-contracts.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-parser-contract.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-source-driver.mjs'
      - 'bible-mindmap/scripts/verify-openscriptures-bdb-adapter.mjs'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
      - '.github/workflows/lexicon-parser-contract.yml'

permissions:
  contents: read

concurrency:
  group: lexicon-parser-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify P1 source and evidence prerequisites
        working-directory: bible-mindmap
        run: |
          node scripts/verify-lexicon-source-registry.mjs
          node scripts/verify-lexicon-evidence-contracts.mjs
      - name: Verify deterministic parser contract and legacy H776 adapter
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-parser-contract.mjs --write=reports/lexicon-parser/GEN-1-1-H776.parser-output.v1.json
      - name: Verify source-neutral driver and fail-closed routing
        working-directory: bible-mindmap
        run: |
          node scripts/verify-lexicon-source-driver.mjs \
            --write-report=reports/lexicon-parser/GEN-1-1-H776.source-driver-report.v1.json \
            --write-output=reports/lexicon-parser/GEN-1-1-H776.source-driver-output.v1.json
      - name: Download pinned OpenScriptures adapter inputs
        working-directory: bible-mindmap
        run: |
          mkdir -p .cache/lexicon/openscriptures
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/openscriptures/HebrewLexicon/21c9add13bc727d3a951361778e97e3ff7afd1ce/BrownDriverBriggs.xml \
            --output .cache/lexicon/openscriptures/BrownDriverBriggs.xml
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/openscriptures/HebrewLexicon/21c9add13bc727d3a951361778e97e3ff7afd1ce/LexicalIndex.xml \
            --output .cache/lexicon/openscriptures/LexicalIndex.xml
      - name: Verify OpenScriptures H776 actual-source tree diff
        working-directory: bible-mindmap
        run: |
          node scripts/verify-openscriptures-bdb-adapter.mjs \
            --bdb=.cache/lexicon/openscriptures/BrownDriverBriggs.xml \
            --index=.cache/lexicon/openscriptures/LexicalIndex.xml \
            --write-output=reports/lexicon-parser/GEN-1-1-H776.openscriptures-source-output.v1.json \
            --write-report=reports/lexicon-parser/GEN-1-1-H776.openscriptures-source-diff.v1.json \
            --write-driver-report=reports/lexicon-parser/GEN-1-1-H776.openscriptures-source-driver.v1.json
      - name: Verify H776 source-to-Golden reconciliation contract
        working-directory: bible-mindmap
        run: |
          node scripts/verify-h776-source-golden-reconciliation.mjs \
            --bdb=.cache/lexicon/openscriptures/BrownDriverBriggs.xml \
            --index=.cache/lexicon/openscriptures/LexicalIndex.xml \
            --write-report=reports/lexicon-parser/GEN-1-1-H776.source-golden-reconciliation-verify.v1.json
      - name: Verify H776 Evidence Packet v2 deterministic regeneration
        working-directory: bible-mindmap
        run: |
          node scripts/verify-h776-evidence-regeneration.mjs \
            --source-output=reports/lexicon-parser/GEN-1-1-H776.openscriptures-source-output.v1.json \
            --write-report=reports/lexicon-parser/GEN-1-1-H776.evidence-regeneration-verify.v1.json
      - name: Upload deterministic parser evidence
        uses: actions/upload-artifact@v7
        with:
          name: lexicon-parser-contract-H776
          path: bible-mindmap/reports/lexicon-parser/
          if-no-files-found: error
          retention-days: 30
