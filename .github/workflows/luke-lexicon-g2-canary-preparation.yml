name: Luke Lexicon G2 Canary Preparation

on:
  push:
    branches:
      - chatgpt/luke-g2-canary-preparation
    paths:
      - 'bible-mindmap/data/lexicon/luke-g0-inventory.json'
      - 'bible-mindmap/data/lexicon/luke-g0-source-lock.json'
      - 'bible-mindmap/data/lexicon/luke-g1-manifest.json'
      - 'bible-mindmap/scripts/build-luke-g2-canary-preparation.mjs'
      - 'bible-mindmap/scripts/materialize-luke-g2-canary-preparation.mjs'
      - 'bible-mindmap/scripts/verify-luke-g2-canary-preparation.mjs'
      - '.github/workflows/luke-lexicon-g2-canary-preparation.yml'
      - 'memory/RESUME.json'
  pull_request:
    paths:
      - 'bible-mindmap/data/lexicon/luke-g0-inventory.json'
      - 'bible-mindmap/data/lexicon/luke-g0-source-lock.json'
      - 'bible-mindmap/data/lexicon/luke-g1-manifest.json'
      - 'bible-mindmap/data/lexicon/luke-g2-canary-preparation.json'
      - 'bible-mindmap/data/lexicon/luke-g2-execution-gate.json'
      - 'bible-mindmap/data/lexicon/luke-g2-report.json'
      - 'bible-mindmap/docs/luke-g2-canary-preparation.md'
      - 'bible-mindmap/scripts/build-luke-g2-canary-preparation.mjs'
      - 'bible-mindmap/scripts/materialize-luke-g2-canary-preparation.mjs'
      - 'bible-mindmap/scripts/verify-luke-g2-canary-preparation.mjs'
      - '.github/workflows/luke-lexicon-g2-canary-preparation.yml'
      - 'memory/RESUME.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luke-g2-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Builder self-test
        working-directory: bible-mindmap
        run: node scripts/build-luke-g2-canary-preparation.mjs --self-test

      - name: Verifier self-test
        working-directory: bible-mindmap
        run: node scripts/verify-luke-g2-canary-preparation.mjs --self-test

      - name: Materialize pinned source and context packets
        working-directory: bible-mindmap
        run: node scripts/materialize-luke-g2-canary-preparation.mjs

      - name: Verify selection, source, context and execution Gate
        working-directory: bible-mindmap
        run: node scripts/verify-luke-g2-canary-preparation.mjs --strict

      - name: Commit deterministic G2 preparation evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bible-mindmap/data/lexicon/luke-g2-canary-preparation.json \
            bible-mindmap/data/lexicon/luke-g2-execution-gate.json \
            bible-mindmap/data/lexicon/luke-g2-report.json \
            bible-mindmap/docs/luke-g2-canary-preparation.md
          if git diff --cached --quiet; then
            echo 'Generated Luke G2 preparation evidence is already current.'
          else
            git commit -m 'data(luke): record G2 canary preparation evidence'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish G2 preparation summary
        working-directory: bible-mindmap
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('data/lexicon/luke-g2-report.json', 'utf8'))
          console.log('## 누가복음 G2 · 대표 10건 준비')
          console.log(`- 판정: **${report.pass ? 'PASS' : 'FAIL'}**`)
          console.log(`- 대표 Strong: **${report.summary.selected}개**`)
          console.log(`- 준비 완료 packet: **${report.summary.ready}개**`)
          console.log(`- 대표 문맥: **${report.summary.representativeContexts}건**`)
          console.log(`- 품사군: **${report.summary.posFamilies.join(', ')}**`)
          console.log(`- 빈도 구간: **${report.summary.frequencyBands.join(', ')}**`)
          console.log('- 실제 provider·로컬 모델 호출: **0건**')
          console.log('- 서비스 사전 쓰기: **0건**')
          NODE
