name: Genesis v4 Batch 03 Materialize Promotion

on:
  push:
    branches:
      - chatgpt/genesis-v4-batch-03-registry-promotion
    paths:
      - 'bible-mindmap/scripts/materialize-genesis-v4-batch-03-promotion.mjs'
      - '.github/workflows/genesis-v4-batch-03-materialize-promotion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-v4-batch-03-materialize-promotion
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 32596baf054a75cff8ff18d94d2c173203eb2626
      RESEARCH_HEAD: 48f1d2c7b406c084102c1c1b26b0ddae0b90b63e
      PROMOTION_APPROVED_AT: '2026-08-12T10:19:42Z'
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fail closed if main moved or another PR owns FIFO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN" || { echo "main moved: expected=$EXPECTED_MAIN actual=$ACTUAL_MAIN"; exit 1; }
          OPEN_OTHER="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '[.[] | select(.head.ref != "chatgpt/genesis-v4-batch-03-registry-promotion")] | length')"
          test "$OPEN_OTHER" = "0" || { echo "FIFO occupied by $OPEN_OTHER other open PR(s)"; exit 1; }
          echo "DERIVED_MAIN=$ACTUAL_MAIN" >> "$GITHUB_ENV"
          git show origin/main:bible-mindmap/data/lexicon/approval-registry.json > /tmp/current-main-approval-registry.json
          git show origin/main:docs/lexicon-workflow/TRACK_STATE.json > /tmp/current-main-track-state.json
          git show origin/main:bible-mindmap/data/lexicon/source-registry.json > /tmp/current-main-source-registry.json

      - name: Checkout exact research head separately
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RESEARCH_HEAD }}
          path: research
          fetch-depth: 1

      - name: Regenerate exact current-main promotion prep from research evidence
        shell: bash
        run: |
          cp /tmp/current-main-source-registry.json research/bible-mindmap/data/lexicon/source-registry.json
          cd research/bible-mindmap
          node scripts/build-genesis-v4-production-batch-03-evidence.mjs --out=/tmp/genesis-v4-production-batch-03-evidence-current-promotion.json
          node scripts/build-genesis-v4-production-batch-03-promotion-prep-v3.mjs \
            --evidence=/tmp/genesis-v4-production-batch-03-evidence-current-promotion.json \
            --registry=/tmp/current-main-approval-registry.json \
            --track-state=/tmp/current-main-track-state.json \
            --out=/tmp/genesis-v4-production-batch-03-promotion-prep-v3.json

      - name: Materialize additive Registry + projections
        working-directory: bible-mindmap
        run: >-
          node scripts/materialize-genesis-v4-batch-03-promotion.mjs
          --prep=/tmp/genesis-v4-production-batch-03-promotion-prep-v3.json
          --approved-at=${{ env.PROMOTION_APPROVED_AT }}
          --expected-main=${{ env.EXPECTED_MAIN }}

      - name: Run dedicated Batch 03 promotion verifier
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-v4-batch-03-registry-promotion.mjs

      - name: Run protected Registry and universal regression guards
        working-directory: bible-mindmap
        run: |
          node scripts/verify-lexicon-approval-registry.mjs
          node scripts/verify-lexicon-registry-universal-regression.mjs
          node scripts/verify-lexicon-v4-approval-provenance.mjs
          node scripts/verify-lexicon-delivery-loader.mjs

      - name: Rebuild deterministically and compare promotion report
        shell: bash
        run: |
          cp bible-mindmap/reports/genesis-v4-production-batch-03-promotion-evidence-v3.json /tmp/promotion-evidence-first.json
          cp bible-mindmap/data/lexicon/approval-registry.json /tmp/registry-first.json
          node bible-mindmap/scripts/verify-genesis-v4-batch-03-registry-promotion.mjs
          cmp /tmp/promotion-evidence-first.json bible-mindmap/reports/genesis-v4-production-batch-03-promotion-evidence-v3.json
          cmp /tmp/registry-first.json bible-mindmap/data/lexicon/approval-registry.json
          echo 'deterministic promotion materialization PASS'

      - name: Remove one-shot write machinery from final PR tree
        shell: bash
        run: |
          rm -rf research
          rm .github/workflows/genesis-v4-batch-03-materialize-promotion.yml
          rm bible-mindmap/scripts/materialize-genesis-v4-batch-03-promotion.mjs

      - name: Commit generated protected proposal
        shell: bash
        run: |
          git config user.name BIBLE_MAP
          git config user.email skyhyangsu63@gmail.com
          git add -A
          git status --short
          test -n "$(git status --porcelain)" || { echo 'no generated changes'; exit 1; }
          git commit -m 'feat(lexicon-v4): propose Genesis Batch 03 Registry promotion'
          git push origin HEAD:chatgpt/genesis-v4-batch-03-registry-promotion
