name: Genesis G3 Context Review Contract

on:
  pull_request:
    paths:
      - 'bible-mindmap/scripts/build-genesis-g3-context-review.mjs'
      - 'bible-mindmap/scripts/verify-genesis-g3-context-review.mjs'
      - 'bible-mindmap/scripts/build-genesis-g3-usage-context-packets.mjs'
      - 'bible-mindmap/scripts/verify-genesis-g3-usage-context-packets.mjs'
      - '.github/workflows/genesis-g2-canary-execute.yml'
      - '.github/workflows/genesis-g3-context-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Builder self-test
        working-directory: bible-mindmap
        run: node scripts/build-genesis-g3-context-review.mjs --self-test

      - name: Verifier self-test
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-g3-context-review.mjs --self-test

      - name: Verify canary workflow integration and safety boundary
        run: |
          file='.github/workflows/genesis-g2-canary-execute.yml'
          grep -q 'build-genesis-g3-usage-context-packets.mjs' "$file"
          grep -q 'verify-genesis-g3-usage-context-packets.mjs --strict' "$file"
          grep -q 'build-genesis-g3-context-review.mjs' "$file"
          grep -q 'verify-genesis-g3-context-review.mjs --strict' "$file"
          grep -q 'reports/genesis-g3-context-review/' "$file"
          ! grep -q 'productionWriteAllowed: true' "$file"
          ! grep -q 'finalApprovalAllowed: true' "$file"

      - name: Publish contract summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 창세기 G3-1 · 후보–실제 용례 문맥 검토 계약
          - BDB·두 provider 후보·창세기 실제 용례 결합: **준비**
          - Strong별 문맥 표본·형태론 분포·저합의 노드 검토: **준비**
          - 사람 검토 체크리스트: **필수**
          - 자동 문맥 승인·서비스 쓰기·최종 승인: **금지**
          - 실제 API 호출: **없음**
          EOF
