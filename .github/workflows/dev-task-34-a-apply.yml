name: Apply TASK-34-A Source Edit

on:
  push:
    branches:
      - gpt/task-34-a-alignment-loader
    paths:
      - '.github/workflows/dev-task-34-a-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/task-34-a-alignment-loader
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply exact source replacements
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'bible-mindmap/src/components/WordSearchModal.jsx'
          let source = fs.readFileSync(path, 'utf8')

          const oldImport = `import LexiconPopup from './LexiconPopup';
          // [정렬 파일럿] 창1:1 H430(엘로힘) 정식 정렬 span 렌더링에 사용.
          // GPT 지시 · findKoreanWord() 문자열 추정 대신 검증된 tokenId + span 을 직접 렌더.
          // 향후 alignment 파일 다수화 시 이 정적 import 는 loadVerseAlignment(...) 로 승격.
          import elohimPilotAlignment from '../../public/data/alignment/pilot/genesis-1-1-elohim.json';`
          const newImport = `import LexiconPopup from './LexiconPopup';
          import AlignmentAwareVerseText from './AlignmentAwareVerseText';`
          if (!source.includes(oldImport)) throw new Error('WordSearch import anchor not found')
          source = source.replace(oldImport, newImport)

          const helperStart = source.indexOf('// [정렬 파일럿] Strong 정규화: H0430 → H430 등.')
          const helperEnd = source.indexOf('function HighlightText', helperStart)
          if (helperStart < 0 || helperEnd < 0) throw new Error('pilot helper anchors not found')
          const normalizedHelper = `function normalizeStrongForAlignment(s) {
            const m = String(s || '').trim().toUpperCase().match(/^([GH])0*(\\d+)$/);
            return m ? \`${'${m[1]}${Number(m[2])}'}\` : String(s || '');
          }

          `
          source = source.slice(0, helperStart) + normalizedHelper + source.slice(helperEnd)

          const usageAnchor = source.indexOf('data-usage-reference=')
          const renderStart = source.indexOf('{(() => {', usageAnchor)
          const renderEnd = source.indexOf('\n                </span>', renderStart)
          if (usageAnchor < 0 || renderStart < 0 || renderEnd < 0) throw new Error('WordSearch render structure not found')
          const newRender = `<AlignmentAwareVerseText
                    enabled={isKoreanView}
                    row={r}
                    rows={allItems}
                    text={verseText}
                    color={fc}
                    fallbackNode={(
                      <ColorHighlightText text={verseText} query={hlWord} color={fc}
                        dir={textDir} fontFamily={textFont} fallback={fallbackMsg}
                        caseSensitive={!isKoreanView && !isEnglishView} />
                    )}
                  />`
          source = source.slice(0, renderStart) + newRender + source.slice(renderEnd)

          if (source.includes('genesis-1-1-elohim.json')) throw new Error('static pilot import remains')
          if (source.includes('findPilotKrvAlignment')) throw new Error('pilot lookup remains')
          if (!source.includes('AlignmentAwareVerseText')) throw new Error('generic renderer missing')
          fs.writeFileSync(path, source)
          NODE

      - name: Verify source edit
        run: |
          node bible-mindmap/scripts/verify-alignment-loader.mjs
          grep -q 'AlignmentAwareVerseText' bible-mindmap/src/components/WordSearchModal.jsx
          ! grep -q 'genesis-1-1-elohim.json' bible-mindmap/src/components/WordSearchModal.jsx
          ! grep -q 'findPilotKrvAlignment' bible-mindmap/src/components/WordSearchModal.jsx

      - name: Commit source edit and remove temporary workflow
        run: |
          rm .github/workflows/dev-task-34-a-apply.yml
          git config user.name 'BIBLE_MAP'
          git config user.email 'skyhyangsu63@gmail.com'
          git add bible-mindmap/src/components/WordSearchModal.jsx .github/workflows/dev-task-34-a-apply.yml
          git commit -m 'feat(alignment): connect WordSearch to generic loader'
          git push origin HEAD:gpt/task-34-a-alignment-loader
