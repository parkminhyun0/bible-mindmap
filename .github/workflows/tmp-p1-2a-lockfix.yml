name: Temporary P1-2a lockfile security fix

on:
  push:
    branches:
      - chatgpt/p1-2a-reranker-contract
    paths:
      - .github/workflows/tmp-p1-2a-lockfix.yml

permissions:
  contents: write

jobs:
  lockfile-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/p1-2a-reranker-contract
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-mindmap/package-lock.json
      - name: Apply npm audit lockfile-only fix
        working-directory: bible-mindmap
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit generated lockfile change
        run: |
          if git diff --quiet -- bible-mindmap/package-lock.json; then
            echo "No lockfile change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible-mindmap/package-lock.json
          git commit -m "Fix fast-uri audit advisory in lockfile"
          git push origin HEAD:chatgpt/p1-2a-reranker-contract
