name: Lexicon Evidence Contract

on:
  pull_request:
    paths:
      # P3 named surfaces (kept for signal visibility)
      - 'bible-mindmap/data/lexicon/schemas/StrongIdentity.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/EvidencePacket.schema.json'
      - 'bible-mindmap/data/lexicon/fixtures/**'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/src/data/lexiconTranslationPilot.js'
      - 'bible-mindmap/scripts/lib/lexicon-evidence-verifier.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-generic-evidence.mjs'
      - 'bible-mindmap/scripts/build-h776-evidence-packet-v2.mjs'
      - 'bible-mindmap/scripts/verify-h776-evidence-regeneration.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-evidence-contracts.mjs'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
      - '.github/workflows/lexicon-evidence-contract.yml'
      # Defensive globs: lexicon data/schema/verifier/build/public delivery and
      # all approved dictionary UI surfaces must retrigger this contract.
      - 'bible-mindmap/data/lexicon/**'
      - 'bible-mindmap/data/lexicon/schemas/**'
      - 'bible-mindmap/scripts/lib/lexicon-**.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-**.mjs'
      - 'bible-mindmap/scripts/build-lexicon-**.mjs'
      - 'bible-mindmap/src/data/lexicon**.js'
      - 'bible-mindmap/src/components/LexiconPopup.jsx'
      - 'bible-mindmap/src/components/LexiconTranslationDrawer.jsx'
      - 'bible-mindmap/src/utils/lexiconTranslationPilotBridge.jsx'
      - 'bible-mindmap/public/lexicon/ko/**'
  push:
    branches:
      - main
    paths:
      # P3 named surfaces (kept for signal visibility)
      - 'bible-mindmap/data/lexicon/schemas/StrongIdentity.schema.json'
      - 'bible-mindmap/data/lexicon/schemas/EvidencePacket.schema.json'
      - 'bible-mindmap/data/lexicon/fixtures/**'
      - 'bible-mindmap/data/lexicon/source-registry.json'
      - 'bible-mindmap/src/data/lexiconTranslationPilot.js'
      - 'bible-mindmap/scripts/lib/lexicon-evidence-verifier.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-generic-evidence.mjs'
      - 'bible-mindmap/scripts/build-h776-evidence-packet-v2.mjs'
      - 'bible-mindmap/scripts/verify-h776-evidence-regeneration.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-evidence-contracts.mjs'
      - 'docs/lexicon-workflow/**'
      - 'memory/RESUME.json'
      - '.github/workflows/lexicon-evidence-contract.yml'
      # Defensive globs (mirror pull_request block).
      - 'bible-mindmap/data/lexicon/**'
      - 'bible-mindmap/data/lexicon/schemas/**'
      - 'bible-mindmap/scripts/lib/lexicon-**.mjs'
      - 'bible-mindmap/scripts/verify-lexicon-**.mjs'
      - 'bible-mindmap/scripts/build-lexicon-**.mjs'
      - 'bible-mindmap/src/data/lexicon**.js'
      - 'bible-mindmap/src/components/LexiconPopup.jsx'
      - 'bible-mindmap/src/components/LexiconTranslationDrawer.jsx'
      - 'bible-mindmap/src/utils/lexiconTranslationPilotBridge.jsx'
      - 'bible-mindmap/public/lexicon/ko/**'

permissions:
  contents: read

concurrency:
  group: lexicon-evidence-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify Source Registry prerequisite
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-source-registry.mjs
      - name: Verify generic Strong evidence, license, provenance and fingerprint contracts
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-generic-evidence.mjs
      - name: Verify P4 Approval Registry, manifest and shard infrastructure contracts
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-approval-registry.mjs
      - name: Verify P4 read-only delivery, loader and rich drawer SSOT contract
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-delivery-loader.mjs
      - name: Verify H776 Golden regression provenance
        working-directory: bible-mindmap
        run: node scripts/verify-lexicon-evidence-contracts.mjs
