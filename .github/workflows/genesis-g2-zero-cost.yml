name: Genesis G2 Zero Cost Verify

on:
  pull_request:
    paths:
      - '.github/workflows/genesis-g2-zero-cost.yml'
      - 'bible-mindmap/scripts/build-genesis-g2-zero-cost-bundle.mjs'
      - 'bible-mindmap/scripts/build-genesis-g2-human-review-bundle.mjs'
      - 'bible-mindmap/scripts/ai/lexicon/genesis-g2-translation-contract.mjs'
      - 'bible-mindmap/scripts/ai/lexicon/run-genesis-g2-local-ollama.mjs'
      - 'bible-mindmap/scripts/ai/lexicon/run-genesis-g2-zero-cost-pipeline.mjs'
      - 'bible-mindmap/scripts/ai/lexicon/import-genesis-g2-zero-cost-manual.mjs'
      - 'bible-mindmap/scripts/verify-genesis-g2-zero-cost-policy.mjs'
      - 'bible-mindmap/docs/genesis-g2-zero-cost-runbook.md'
      - 'bible-mindmap/docs/genesis-g2-zero-cost-one-command.md'
      - 'bible-mindmap/docs/genesis-g2-human-review-hardening.md'
      - 'bible-mindmap/package.json'
      - 'memory/RESUME.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-zero-cost-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify offline bundle builder
        working-directory: bible-mindmap
        run: node scripts/build-genesis-g2-zero-cost-bundle.mjs --self-test

      - name: Verify Korean candidate contract
        working-directory: bible-mindmap
        run: node scripts/ai/lexicon/genesis-g2-translation-contract.mjs --self-test

      - name: Verify local-only Ollama boundary
        working-directory: bible-mindmap
        run: node scripts/ai/lexicon/run-genesis-g2-local-ollama.mjs --self-test

      - name: Verify one-command local pipeline
        working-directory: bible-mindmap
        run: node scripts/ai/lexicon/run-genesis-g2-zero-cost-pipeline.mjs --self-test

      - name: Verify manual candidate importer
        working-directory: bible-mindmap
        run: node scripts/ai/lexicon/import-genesis-g2-zero-cost-manual.mjs --self-test

      - name: Verify human review bundle
        working-directory: bible-mindmap
        run: node scripts/build-genesis-g2-human-review-bundle.mjs --self-test

      - name: Verify zero-cost policy
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-g2-zero-cost-policy.mjs

      - name: Publish summary
        run: |
          {
            echo '## 창세기 G2 · 무과금 경로 검증'
            echo '- 외부 유료 API 호출: **0**'
            echo '- GitHub Secret 사용: **0**'
            echo '- 외부 cloud model 사용: **차단**'
            echo '- 허용 실행 주소: **localhost / 127.0.0.1:11434**'
            echo '- 로컬 기본 안정값: **temperature=0 · num_ctx=8192**'
            echo '- 한글 음역·외국어 혼입·confidence·필수 위험 플래그: **검증**'
            echo '- BDB source packet 포함 사람 검토 묶음: **검증**'
            echo '- 완전 수동 JSON 후보 변환: **검증**'
            echo '- 평가·문맥·신학 감사 패킷 연결: **준비**'
            echo '- 번역 후보 자동 서비스 반영: **차단**'
            echo '- 사람 문맥 검토·신학 감사: **필수**'
          } >> "$GITHUB_STEP_SUMMARY"
