name: Genesis G2 Promotion Review Gate

on:
  pull_request:
    paths:
      - 'bible-mindmap/scripts/build-genesis-g2-promotion-review.mjs'
      - 'bible-mindmap/scripts/verify-genesis-g2-calibration-promotion.mjs'
      - 'bible-mindmap/scripts/verify-genesis-g2-calibration-candidates.mjs'
      - '.github/workflows/genesis-g2-canary-execute.yml'
      - '.github/workflows/genesis-g2-calibration-execute.yml'
      - '.github/workflows/genesis-g2-promotion-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify promotion review packet contract
        working-directory: bible-mindmap
        run: node scripts/build-genesis-g2-promotion-review.mjs --self-test

      - name: Verify human promotion approval contract
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-g2-calibration-promotion.mjs --self-test

      - name: Verify calibration candidate contract
        working-directory: bible-mindmap
        run: node scripts/verify-genesis-g2-calibration-candidates.mjs --self-test

      - name: Publish Gate summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 창세기 G2-5 · 승격 검토·100개 확대 Gate
          - canary 결과 사람 검토 패킷: 계약 검증
          - 평가 digest와 사람 승인 증거: 계약 검증
          - 100개 × 2 provider 후보 전수 verifier: 계약 검증
          - 자동 승격·서비스 쓰기·최종 승인: 차단
          EOF
