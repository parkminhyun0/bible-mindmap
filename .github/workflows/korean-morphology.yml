name: Validate Korean Morphology

on:
  # `verify` is a required branch-protection check. Keep it present on every PR;
  # path-filtering this workflow leaves unrelated PRs permanently "expected" and
  # blocks merge without providing any additional quality signal.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Verify representative Hebrew and Greek forms
        working-directory: bible-mindmap
        run: node scripts/verify-korean-morphology.mjs
